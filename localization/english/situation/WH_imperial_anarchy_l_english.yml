 #Events Loc
 ## ANARCHY IS OVER, HURRAY
 imperial_anarchy.head: "The Anarchy:"
 imperial_anarchy.1000.t: "$imperial_anarchy.head$ Imperial Triumph"
 imperial_anarchy.1000.t.ulric: "$imperial_anarchy.head$ Wolf Emperor Triumphant"
 imperial_anarchy.1000.t.vampire: "$imperial_anarchy.head$ Immortal Empire"
 imperial_anarchy.1000.t.orc: "$imperial_anarchy.head$ Wait... What?"
 imperial_anarchy.1000.desc.intro: "At long last, this woeful Anarchy must end. The Empire is once again united, the beating heart of The Old World!\n\n"
 imperial_anarchy.1000.desc.sigmar: "Sigmar is the God of the Empire, and so only his Cult has the right to choose the next Emperor."
 imperial_anarchy.1000.desc.ulric: "As Ulric chose the First Emperor, it is fitting that his cult should choose the next one."
 imperial_anarchy.1000.desc.taal: "As Taal and Rhya are King and Queen of the Gods, their cults possess the wisdom to choose the next Emperor."
 imperial_anarchy.1000.desc.sister: "Long have the Sisters of Sigmar been met with suspicion, but now their faith is proven wisest and truest."
 imperial_anarchy.1000.desc.gwacslayer: "The vote was unanimous, for who could deny the Slayer of the Everchosen as the truest son of The Empire?"
 imperial_anarchy.1000.desc.state: "\n\nAs masters of The Empire, the [ROOT.Char.Custom('LadiesLords')] of [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] shall rise to deserved prominence!"
 imperial_anarchy.1000.a: "Long Live The Empire!"

 imperial_anarchy.1000.desc.vampire: "Though my heart beats not, my claim to the Imperial Title is truer than any Human princeling.\n\nThe Mortal subjects of The Empire may quail at the thought of an undead overlord, but like the Sylvanians, they will come to appreciate the benefits of Immortal Rule.\n\nAs now begins my reign of a thousand- no, a million years!"
 imperial_anarchy.1000.a.vampire: "From the grave, rises The Empire!"
 imperial_anarchy.1000.desc.orc: "ALROIT, DIS ANORCHY BIZNESS WAS FUN AN' ALL, BUT NOW ITS TIME FOR A PROPA EMPERORC TO TAKE CHARGE.\n\nI'LL ROOL DIS PLACE BETTA THAN ANY HUMIE, OR MAYBE JUST SMASH IT ALL FOR FUN, DUNNO.\n\nWE'LL DO A COUNTY-THING, CUS YOU 'MPEERIALS LIKE DAT.\n\nWHO VOTES FOR ME?\n\n...DATS ONE.\n\nANY AGAINST?\n\n..."
 imperial_anarchy.1000.a.orc: "...DIDNT FINK SO."



 