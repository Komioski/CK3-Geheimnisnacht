 anarchy_history_key_no_emperors: "After the mysterious death of Emperor Manfred Skavenslayer, the Imperial Election ends in stalemate. There is no Emperor for many centuries during the #Bold Age of Wars.#!"
 anarchy_history_key_two_emperors: "Countess Ottillia, supported by the Al-Ulric, accuses the Stirland Emperor-Elect of bribery and Sigmarite corruption. Her successors claim the title during the #Bold Time of Two Emperors.#!"
 anarchy_history_key_three_emperors: "A violent exchange during an Election leads Count Seigfried of Middenland to name himself 'Wolf Emperor'. Warring and revolt increased during the #Bold Age of the Three Emperors.#!"
 anarchy_history_key_restless_dead: "By unknown means, graves empty across the Old World during the #Bold Night of the Restless Dead#!. The vigilance of the Sylvanians earns their province sovereignty from Stirland."
 anarchy_history_key_crusade_araby: "The Empire joins the #Bold Crusades against Araby#! but ultimately fail to unite against a common foe."
 anarchy_history_key_four_emperors: "The Grand Theoginist Vilgrim III refuses to crown Magritta of Marienburg, instead supporting the Reikland electors. With Four Emperors competing the title, any illusion of central power breaks down and #Bold The Anarchy#! begins in earnest."

