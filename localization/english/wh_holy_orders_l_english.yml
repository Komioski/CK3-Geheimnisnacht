 #Holy Order MaAs#
 myrmidia_knights:0 "Order Knights"
 myrmidia_knights_flavor:0 "Knights are magnificent figures, clad in gleaming full plate armour crafted by Dwarfen smiths, armed with weaponry of the finest quality. To become a Knight is also to become one of the most elite warriors the Empire has to offer."
 bret_questing:0 "Questing Knights"
 bret_questing_flavor:0 "A Questing Knight is a former Knight of Bretonnia who has taken up the Questing Vow and now seeks the blessings of the Lady of the Lake, in the hopes of becoming accepted into the ranks of the legendary Grail Knights."