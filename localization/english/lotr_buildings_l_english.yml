 #Military Buildings#
 building_dwarven_armory_01: "Basic Stockpiles"
 building_dwarven_armory_01_desc: "The construction of storage rooms for weapons and armour has raised the quality of the average soldier."
 building_dwarven_armory_02: "Gambesons"
 building_dwarven_armory_02_desc: "This Hold has standardized the use of Gambesons, and Armouries throughout are equipped to replace it."
 building_dwarven_armory_03: "Improved Whetstones"
 building_dwarven_armory_03_desc: "Soldiers are now equipped with their own care kit. The whetstones ensure a keen edge for every weapon."
 building_dwarven_armory_04: "Chain Mail"
 building_dwarven_armory_04_desc: "Links of chain are threaded together to create a more flexible armour resistant to slashing attacks and denting."
 building_dwarven_armory_05: "Cleaning Oil"
 building_dwarven_armory_05_desc: "Through using a more effective cleaning oil, the damage caused by rust is reduced significantly."
 building_dwarven_armory_06: "Grindstones"
 building_dwarven_armory_06_desc: "Advanced Grindstones enable the use of sharper weapons and makes sure they are well maintained."
 building_dwarven_armory_07: "Lamellar Armour"
 building_dwarven_armory_07_desc: "Consisting of a series of interwoven metal strips, this design allows for improved protection and easier repair due to the ability to replace individual strips."
 building_dwarven_armory_08: "Reinforced Shields"
 building_dwarven_armory_08_desc: "The use of Iron enables more protective shields that also require less replacement. Attacks slide off the shields with nary a scratch."
 building_dwarven_armory_09: "Plate Armour"
 building_dwarven_armory_09_desc: "Compared to previous sets, plate armour offers full body coverage. Any soldier wearing this would strike fear into the hearts of enemies."
 building_dwarven_armory_10: "Arsenal of Mahal"
 building_dwarven_armory_10_desc: "Armouries of this Hold have reached a dizzying level. The Quartermasters have organized into a veritable army capable of repairing or replacing nearly anything. It is said that if a Dwarf scratches his helm, he cannot walk three steps without receiving a new one."
 building_type_dwarven_armory_01: "Arms Storage"
