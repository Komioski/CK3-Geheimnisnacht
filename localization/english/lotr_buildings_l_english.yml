 ### WASTELANDS ###
 building_type_wilderness_01: "Wilderness"
 building_type_wilderness_01_desc: "Lands with dangerous foes, which can not sustain human life unless colonised"
 building_wilderness_01: "Wilderness"
 building_wilderness_01_desc: "Lands with dangerous foes, which don't sustain human life unless colonised"
 building_type_settlement_01: "Settlement"
 building_type_settlement_01_desc: "Allows to exploit the wilderness, partially reducing the effects of the surrounding foes."
 building_settlement_01: "Quiet Villages"
 building_settlement_01_desc: "Humble hamlets and villages dot the landscape, home to hardy settlers braving the elements and establishing a foothold in this wild land."
 building_settlement_02: "Lonely Towns"
 building_settlement_02_desc: "Small towns have begun to grow across the land, attracting more people as their inhabitants begin to conquer the wilds."
 building_settlement_03: "Bustling Colony"
 building_settlement_03_desc: "Well-established settlements buzz with activity and excitement as the last remnants of the Wilderness are tamed."

 building_type_stockades_01: "Stockades"
 building_type_stockades_01_desc: "Basic stockades form a simple barrier between a settlement and the wilderness beyond, but they offer limited protection from organised attacks and raids."
 building_stockades_01: "Stockades"
 building_stockades_01_desc: "Basic stockades form a simple barrier between a settlement and the wilderness beyond, but they offer limited protection from organised attacks and raids."

 building_type_trading_outposts_01: "Trading Outposts"
 building_type_trading_outposts_01_desc: "Trading outposts offer the opportunity for settlers and traders to meet and barter for goods produced and demanded by the [colony|E]."
 building_trading_outposts_01: "Trading Outposts"
 building_trading_outposts_01_desc: "Trading outposts offer the opportunity for settlers and traders to meet and barter for goods produced and demanded by the [colony|E]."

 building_type_local_militia_01: "Local Militia"
 building_type_local_militia_01_desc: "Rugged frontiersmen, the local militia trains and stores its weapons in this location. Though not always many, they are fierce and possessing stout hearts."
 building_local_militia_01: "Local Militia"
 building_local_militia_01_desc: "Rugged frontiersmen, the local militia trains and stores its weapons in this location. Though not always many, they are fierce and possessing stout hearts."

 building_construction_guilds_01: "Construction Guilds"
 building_construction_guilds_01_desc: "Skilled builders and craftsmen set up shop in the [colony|E], bringing their expertise and helping to develop settlements from the ground up."
 building_type_construction_guilds_01: "Construction Guilds"
 building_type_construction_guilds_01_desc: "Skilled builders and craftsmen set up shop in the [colony|E], bringing their expertise and helping to develop settlements from the ground up."

