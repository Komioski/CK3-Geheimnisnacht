### GONDOR WONDERS ###

 # Minas Tirith
 building_type_wonder_minas_anor_01: "Minas Anor"
 building_type_wonder_minas_anor_01_desc: ""
 building_wonder_minas_anor_01: "Minas Anor"
 building_wonder_minas_anor_01_desc: "#TOLKIENQUOTE "Other strong places they built also upon either hand: Minas Ithil, the Tower of the Rising Moon, eastward upon a shoulder of the Mountains of Shadow as a threat to Mordor; and to the westward Minas Anor, the Tower of the Setting Sun, at the feet of Mount Mindolluin, as a shield against the wild men of the dales. In Minas Ithil was the House of [isildur|E], and in Minas Anor the house of [anarion|E]."#!\n\nMinas Anor is the ancient tower of Anárion, built to guard the capital of Osgiliath to the west. Raised opon the crest of a mighty hill and encricled at the base with a wall of unbreakable black stone, the fortress was a work of marvel. Few men lived in the city, for after the dwindling of the Oathbreakers the tower stood only to guard the tombs of the kings, built along Rath Dínen behind the citadel."
 building_wonder_minas_anor_02: "Seven Circles of the City"
 building_wonder_minas_anor_02_desc: "#TOLKIENQUOTE "For the fashion of Minas Tirith was such that it was built on seven levels, each delved into the hill, and about each was set a wall, and in each wall was a gate. But the gates were not set in a line: the Great Gate in the City Wall was at the east point of the circuit, but the next faced half south, and the third half north, and so to and for upwards; so that the paved way that climbed toward the citadel turned first this way and then that across the face of the hill. And each time that it passed the line of the Great Gate it went through an arched tunnel, piercing a vast pier of rock whose huge out-thrust bulk divided in two all the circles of the City save the first. For partly in the primeval shaping of the hill, partly by the mighty craft and labour of old, there stood up from the rear of the wide court behind the Gate a towering bastion of stone; its edge sharp as a ship-keel facing east. Up it rose, even to the level of the topmost circle, and there was crowned by a battlement; so that those in the Citadel might, like mariners in a mountainous ship, look from its peak sheer down upon the Gate 700 feet below."#!\n\nExpanded by King Ostoher in [thirdage|E] 420, Minas Anor now boasts a mighty seven walls, rendering any enemy unable of siezing it by force and securing the summer residence of the Kings of [gondor|E]."
 building_wonder_minas_anor_03: "The Houses of Healing"
 building_wonder_minas_anor_03_desc: "#TOLKIENQUOTE "For though all lore was in these later days fallen from its fullness of old, the leechcraft of Gondor was still wise, and skilled in the healing of wound and hurt, and all such sickness as east of the Sea mortal men were subject to. Save old age only. For that they had found no cure..."#!\n\nThe Houses of Healing are located on the 6th ring of [minastirith|E], surrounded by relaxing gardens and fine trees. In this building are the most advanced healers of [gondor|E] trained, and in the surrounding palatial complex, patients are housed during their recuperation. Those with dire illnesses come from far and wide in hopes the bright minds of the Houses of Healing might be able to help them."
 building_wonder_minas_anor_04: "House of the Kings"
 building_wonder_minas_anor_04_desc: "In [thirdage|E] 1636 the Great Plague devastated [gondor|E], slaying the king and his children and laying waste to Osgiliath once again. Already damaged by its sack during the [kinstrife|E], the once great city was no longer fit to the capital of [gondor|E], and in [thirdage|E] 1640 King Tarondor moved the King's House permanently to Minas Anor. He replanted a seedling of the White Tree in the citadel and rebuilt and improved the city, leading Minas Anor to now eclipse Osgiliath in majesty, for the former was now partly deserted and began to fall into ruin."
 building_wonder_minas_anor_05: "Minas Tirith"
 building_wonder_minas_anor_05_desc: "#TOLKIENQUOTE "It was thus in the reign of King Eärnil, as later became clear, that the Witch-King escaping from the North came to Mordor, and there gathered the other Ringwraiths, of whom he was the chief. But it was not until 2000 that they issued from Mordor by the Pass of Cirith Ungol and laid siege to Minas Ithil. This they took in 2002, and captured the Palantír of the tower. They were not expelled while the [thirdage|E] lasted; and Minas Ithil became a place of fear, and was renamed Minas Morgul.\nMinas Anor, which had become the chief city of the realm since the days of king Telemnar, and the residence of the kings, was now renamed Minas Tirith, as the city ever on guard against the evil of Morgul."#!\n\nMinas Anor is no longer a city of peace, for evil has come to her door, and now she must remain on ceaseless guard to defend the rest of [gondor|E]. The White Tower in the midst of the citadel has been rebuilt, the walls strengthened, and the city equipped for war and watch."
 minas_ithil_has_fallen_tt: "Minas Ithil has fallen"
 osgiliath_has_fallen_tt: "Osgiliath has fallen"
 building_wonder_minas_anor_06: "The Tower of Ecthelion"
 building_wonder_minas_anor_06_desc: "#TOLKIENQUOTE "Even as Pippin gazed in wonder the walls passed from looming grey to white, blushing faintly in the dawn; and suddenly the sun climbed over the eastern shadow and sent forth a shaft that smote the face of the City. then Pippin cried aloud, for the Tower of Ecthelion, standing high within the topmost wall, shone out against the sky, glimmbering like a spike and oearl and silver, tall and fair and shapely, and its pinnacle glittered as it were wrought of crystals; and white banners broke and fluttered from the battlements in the morning breeze, and high and far he heard a clear ringing as of silver trumpets."#!\n\nThe White Tower has loomed high over the plains of Pelennor and the halls of the Kings since [ageTA|E] 1900, when it was constructed by King Calimehtar. It was rebuilt in T.A. 2698 by the steward Ecthelion I, after whom the tower is now known. It holds the throne room of the Lords of the City and in a secrect chamber guards the [palantirone|E] of Minas Anor. The Guards of the Citadel keep their station on the highest circle of [minastirith|E], guarding the courtyard before the Tower and the Hall of Kings."
 building_wonder_minas_anor_07: "Flowering of the White Tree"
 building_wonder_minas_anor_07_desc: "#TOLKIENQUOTE "In his time the City was made more fair than it had ever been, even in the days of its first glory; and it was filled with trees and fountains, and its gates were wrought of mithril and steel, and its streets were paved with white marble; and the Folk of the Mountain laboured in it, and the Folk of the Wood rejoiced to come there; and all was healed and made good, and the houses were filled with men and women and the laughter of children, and no window was blind nor any courtyard empty; and after the ending of the Third Age of the world into the new age it preserved the memory and the glory of the years that were gone."#!\n\nIn the days of the King, [minastirith|E] once more becomes Minas Anor, for [gondor|E]'s long watch is ended. After so many years, the White Tree flowers anew in the court of the Kings, with a sapling found in the snowy drifts of Mindolluin. \n\nIn this city shall the memory of the Elder Days long remain undwindled, and may it be blessed, while the thrones of the [valar|E] endure."


 # Minas Ithil/Morgul
 building_type_wonder_minas_ithil_01: "Minas Ithil"
 building_type_wonder_minas_ithil_01_desc: "[minasithil|E], Tower of the Moon, was a city-fortress of [gondor|E], and sister city to Minas Anor. It was the seat of [isildur|E], and the original home of the White Tree before it was sacked in [ageSA|E] 3429."
 building_wonder_minas_ithil_01: "Minas Ithil"
 building_wonder_minas_ithil_01_desc: "[minasithil|E], Tower of the Moon, was a city-fortress of [gondor|E], and sister city to Minas Anor. It was the seat of [isildur|E], and the original home of the White Tree before it was sacked in [ageSA|E] 3429. A sapling was recovered at great cost and planted in Minas Anor. Afterwards, it was recovered and maintained as a fortress of [gondor|E] into the middle [thirdage|E]."
 building_wonder_minas_ithil_02: "Minas Morgul"
 building_wonder_minas_ithil_02_desc: "Corrupted and defiled by the foul magics of the Witch-King, [minasithil|E] fell in the year [ageTA|E] 2002, after two years of siege. Now, it is the greatest of the Nazgul's home, renamed [minasmorgul|E] - the Tower of Sorcery."
 building_wonder_minas_ithil_03: "Minas Ithil: Gardens of the Moon"
 building_wonder_minas_ithil_03_desc: "[minasithil|E] has sat silent and empty since it was retaken, by decree of the King. He said that Minas Ithil would need many years to recover from the vile acts done there. But now at last the city of [isildur|E] is healing, and the gardens of the moon shine silver beneath the gaze of the tower."
 not_morgul_corrupted: "[GetTitleByKey('c_minas_ithil').GetNameNoTier] no longer has the [GetStaticModifier('fading_morgul_corruption_modifier').GetNameWithTooltip] [county|E] [modifier|E]"

 building_type_wonder_minas_ithil_original: "Minas Ithil"
 building_type_wonder_minas_ithil_original_desc: "[minasithil|E], Tower of the Moon, was a city-fortress of [gondor|E], and sister city to Minas Anor. It was the seat of [isildur|E], and the original home of the White Tree before it was sacked in [ageSA|E] 3429."
 building_wonder_minas_ithil_original: "Minas Ithil"
 building_wonder_minas_ithil_original_desc: "[minasithil|E], Tower of the Moon, was a city-fortress of [gondor|E], and sister city to Minas Anor. It was the seat of [isildur|E], and the original home of the White Tree before it was sacked in [ageSA|E] 3429. A sapling was recovered at great cost and planted in Minas Anor. Afterwards, it was recovered and maintained as a fortress of [gondor|E] into the middle [thirdage|E]."

 # Rammas Echor
 building_type_wonder_rammas_echor_01: "Rammas Echor"
 building_type_wonder_rammas_echor_01_desc: "First constructed by the Steward Mardil Voronwë during the reign of Eärnur, the Rammas Echor provides potent defenses for the prosperous farmlands of Pelennor and [minastirith|E]."
 building_wonder_rammas_echor_01: "Decayed Rammas Echor"
 building_wonder_rammas_echor_01_desc: "The Rammas Echor, first constructed by the Steward Mardil Voronwë during the reign of Eärnur, has fallen into a sorry state, with stones from the walls and towers being repurposed by the local people. However, even decayed, the once-impressive stoneworks provide some defence for the Pelennor."
 building_wonder_rammas_echor_02: "Restored Rammas Echor"
 building_wonder_rammas_echor_02_desc: "After much effort and cost, the Rammas Echor at last stands strong and proud, fully rebuilt and restored. The townlands and fields of Pelennor now stretch from the outer wall of [minastirith|E] to the Rammas Echor, a safely defended garden in which the flowers of [gondor|E] thrive. \n\nIt shall endure as a testament to the long watch of the Stewards."

 # Port of Pelargir
 building_type_wonder_port_of_pelargir_01: "Port of Pelargir"
 building_type_wonder_port_of_pelargir_01_desc: "Originally founded by the [faithful|E] in [ageSA|E] 2350, Pelargir is one of the preeminent cities of [gondor|E] and among the most storied. In addition to being a major port and trade hub, it is also the primary home of the royal navy."
 building_wonder_port_of_pelargir_01: "Port of Pelargir"
 building_wonder_port_of_pelargir_01_desc: "The oldest [numenorean|E] settlement in [gondor|E], founded by the [faithful|E] in [ageSA|E] 2350, Pelargir holds the distinct honour of being the home of the royal navy. It is also Gondor's primary maritime port, with vast quantities of trade goods flowing in and out of its marble storehouses."
 building_wonder_port_of_pelargir_02: "Palace of the Ship-Kings"
 building_wonder_port_of_pelargir_02_desc: "Originally constructed by Tarannon Falastur, the 12th King of [gondor|E], the Palace of the [shipkings|E] refers to the royal residence built within Pelargir. It is built half upon the land and half upon arches that rise out of the water, a marvel of [gondorian|E] engineering. It rises up from the centre of the city, dominating the skyline, and in the later days became the residence of the Sealord of Pelargir and the captains of the Royal Navy."
 building_wonder_port_of_pelargir_03: "Eithel Ulu"
 building_wonder_port_of_pelargir_03_desc: "One of the few holy sites of the [dunedain|E], the [eithel_ulmo|E] refers to a shallow pool of water deep within the base of the tower of the Sealord. Sealed behind mighty iron doors that only the greatest loremasters and the Sealord himself can open, the pool is a dwelling place for the presence of the Lord of the Deep, [ulmocharacter|E]. \n\nHere he might whisper advice to those who come seeking his counsel, and his continuing presence is a memory of the pact between the Lord of the Deep and the [numenorean|E] sailors of old."

 #Port of Hyarpende
 building_type_wonder_port_of_hyarpende_01: "The Port of Hyarpendë"
 building_type_wonder_port_of_hyarpende_01_desc: "Hyarpendë (Q. Southern Slope) was a Númenórean haven built in [ageSA|E] 2432 opposite Pelargir on what was originally a ferry station that linked Pelargir with Hyarmentië (Q. Southern Way). Hyarpendë growth grew accordingly to Pelargir's, and life in the city was intimately connected with that of Pelargir. By the late Second Age, the city had grown from a lazy village into a bustling gate to the lands east of the Anduin.\n\nMuch like Pelargir, Hyarpendë had in its early days been only a few miles away from the coasts, but after the [downfallofnumenor|E], the coasts along the Bay of Belfalas had retreated a great distance, and the city was left far inland. Hyarpendë remained the biggest city on the lands that would become Ithilien until the founding of Minas Ithil in S.A. 3320."
 building_wonder_port_of_hyarpende_01: "The Port of Hyarpendë"
 building_wonder_port_of_hyarpende_01_desc: "Hyarpendë (Q. Southern Slope) was a Númenórean haven built in [ageSA|E] 2432 opposite Pelargir on what was originally a ferry station that linked Pelargir with Hyarmentië (Q. Southern Way). Hyarpendë's growth followed that of Pelargir, and life in the city was intimately connected with that of Pelargir. By the late Second Age, the city had grown from a lazy village into a bustling gate to the lands east of the Anduin.\n\nMuch like Pelargir, Hyarpendë had in its early days been only a few miles away from the coasts, but after the [downfallofnumenor|E], the coasts along the Bay of Belfalas had retreated a great distance, and the city was left far inland. Hyarpendë remained the biggest city on the lands that would become Ithilien until the founding of Minas Ithil in S.A. 3320."

 # Dol Amroth
 building_type_wonder_dol_amroth_01: "Dol Amroth"
 building_type_wonder_dol_amroth_01_desc: "The capital of Dor-en-Ernil, among the greatest of [gondor|E]'s cities."
 building_wonder_dol_amroth_01: "Hill of Amroth"
 building_wonder_dol_amroth_01_desc: "Belfalas was originally settled by the Sindar elves in the early [secondage|E]. Eventually, a noble [numenorean|E] family built a fortress on the promontory of the peninsula. This land under the [numenoreans|E] became known as Dor-en-Ernil. Its lord was given the title of 'Prince' by Elendil at the founding of the Realms-in-Exile. The last of the Elves of Belfalas passed oversea in [ageTA|E] 1981, and the former king of Lórien, Amroth, died trying to swim back to shore. Since that time, the hill has been known as Dol Amroth, the Hill of Amroth."
 building_wonder_dol_amroth_02: "Scholars Quarter"
 building_wonder_dol_amroth_02_desc: "After Minas Tirith, Dol Amroth is the foremost centre of learning and lore within the Kingdom of [gondor|E]. In the Scholars Quarter, loremasters and scholars debate publicly in the open forum, and there are many libraries and repositories of ancient craft. \n\nOf particular note is the Museum of Imrazôr, founded by the Prince of the same name, in which many of the remaining artifacts of the Elven period are housed and studied. Open 5 days of the week, free of charge."
 building_wonder_dol_amroth_03: "Keep of the Swan-Knights"
 building_wonder_dol_amroth_03_desc: "The Swan Knights are headquartered in a tower on an island that is connected to the primary city only by a strong bridge. Here are the grandmaster's quarters (traditionally the heir to the Prince of Dol Amroth), as well as the stables and forges in which the mighty Swan-Knights are equipped. It has a full larder, well stocked, and the knights stand ready to sally forth or endure a siege."

 building_type_wonder_tirith_aear: "Tirith Aear"
 building_type_wonder_tirith_aear_desc: "The Tirith Aear, or 'Sea-ward Tower' in [sindarin|E], is the great tower of Dor-en-Ernil, once built by the [elves|E] dwelling within the region. The name has also become that of the élite guard units which protect the tower, the Oathkeepers of Tirith-Aear, the best of the Sea-ward troops. Required to swear oaths of virtue and valour, these wardens should be of unimpeacheable character.\n\nSeparated from the main city of Dol Amroth, the Seaward Tower stands high upon the cliffs, overlooking the Cobas Harbour and Edhellond, keeping an everlasting watch over the waters of the Bay of Belfalas."
 building_wonder_tirith_aear: "Tirith Aear"
 building_wonder_tirith_aear_desc: "$building_type_wonder_tirith_aear_desc$"
 building_type_wonder_tirith_aear_decayed: "Decayed Tirith Aear"
 building_type_wonder_tirith_aear_decayed_desc: "The Tirith Aear, or 'Sea-ward Tower' in [sindarin|E], is the great tower of Dor-en-Ernil, once built by the [elves|E] dwelling within the region. Once a shining symbol of both hope and peace for all in Belfalas, the tower has fallen into disrepair and is now nothing more than an empty husk and a mark of shame for the Princes that have long neglected it.\n\nSeparated from the main city of Dol Amroth, the Seaward Tower stands high upon the cliffs, overlooking the Cobas Harbour and Edhellond. If repaired, it could once more keep its vigilant watch over the pristine Bay of Belfalas..."
 building_wonder_tirith_aear_decayed: "Decayed Tirith Aear"
 building_wonder_tirith_aear_decayed_desc: "$building_type_wonder_tirith_aear_decayed_desc$"

 # Tolfalas (Imrazôr's Hallow)
 building_type_wonder_imrazor_hallow: "Imrazôr's Hallow"
 building_type_wonder_imrazor_hallow_desc: "The resting place of the princes of Belfalas and Tolfalas, one of the most sacred sites of the [dunedain|E]."
 building_wonder_imrazor_hallow: "Cove of Uinen"
 building_wonder_imrazor_hallow_desc: "The burial place of the princes of Belfalas and Tolfalas, Imrazôr's Hallow is in a small cove on the northwestern shore of Tolfalas. One of the few sacred sites of the [dunedaingondor|E], the cove holds the last surviving Oiolairë trees. \n\nThese fragrant trees were native to Númenor and the symbol of the covenant between the Maia Uinen and the Guild of Venturers. It was the custom among [numenorean|E] mariners to place a cut bough of oiolairë on the prows of their ships, called the Green Bough of Return, as a symbol of good fortune. Uinen's power still protects the hallow to this day."

 # Tharagrondost
 building_type_wonder_tharagrondost_01: "Tharagrondost"
 building_type_wonder_tharagrondost_02_desc: "The mighty citadel of Tharagrondost, the western berth of the [gondorian|E] Navy."
 building_wonder_tharagrondost_01: "Tharagrond"
 building_wonder_tharagrondost_01_desc: "[numenorean|E] colonists first founded Tharagrondost c. SA 2300. Set upon a steep spire of rock overlooking a small cove near the base of the Cape of Andrast, its formidable defenses were designed to protect it from the indigenous population. However, the founding of the settlement of Pelargir as the centre of Faithful immigration to the Bay of Belfalas a few decades later quickly led to Tharagrondost becoming something of an isolated backwater."

 building_wonder_tharagrondost_02: "Citadel of Tharagrondost"
 building_wonder_tharagrondost_02_desc: "Built in [ageTA|E] 1652 to defend western [gondor|E] from sea-raiders, the Citadel of Tharagrondost is the western haven of the Royal Navy. Originally supplied by a grail-doll from Anfalas, the havens were eventually changed from a royal garrison to a fiefdom under the Lords of Andrast. \n\nHowever, [gondorian|E] control of the region remains largely in name, with the Citadel of Tharagrondost standing as a testament to their claims in a hinterland with few [dunedain|E]. Even with this lack of control of the land, Tharagrondost fulfills its duty of guarding the western seas."

 building_type_wonder_tharagrondost_expanded: "Tharagrondost"
 building_type_wonder_tharagrondost_expanded_desc: "The mighty city of Tharagrondost, main city and citadel of Andrast"
 building_wonder_tharagrondost_expanded: "Great City of Tharagrondost"
 building_wonder_tharagrondost_expanded_desc: "Tharagrondost, once a lone citadel of [dunedain|E] in Andrast, became the center of the region. Greater havens and higher walls has been built with the support of finest architects of [gondorians|E]. Fur, honey and trees from Andrast are sailing from its port to the Gondorian heartlands. Its mighty citadel defends local people from the threat of raiders. After many years of wise stewardship, Tharagrondost truly became one of the greatest cities of [gondor|E]."
 tharagrondost_building: "Expand Tharagrondost decision is completed"

#City of Serelond
 building_type_wonder_serelond: "Serelond"
 building_wonder_serelond: "City of Serelond"
 building_wonder_serelond_desc: "Serelond was founded in the [ageSA|E] 2903 by enterprising merchants from the Pelargirian League, an outpost to serve as an entrepot to the inland regions. However, in time the entrepot became a full [colony|E], and Serelond became a common place for the politically defeated or disgraced of the League to retire to.\n\nIndeed, after the Pelargirian League came to its agreement with [isildur|E] and [anarion|E] to swear fealty, the premier members of the effort opposing fealty relocated to Serelond, where the power of the Kings was minimal. While on paper Serelond swore fealty to [gondor|E] - as did all the Dunedain realms on the Bay of Belfalas, in practice the realms in Anfalas and Andrast functioned as independent city-states, with little oversight and paying only lip service to their fealty.\n\nThis would ultimately be ended by Tarannon Falastur's westward expansion, when he curbed the independence of these old coastal city-states, forcing them to honor their obligations and vows, ending their autonomy, and incorporating them as proper provinces of Gondor."
 building_wonder_serelond_arsenal: "Arsenal of Serelond"
 building_wonder_serelond_arsenal_desc: "Serelond's port was fashioned in the ways of the [numenoreans|E], making use of a suitable natural bay. Quays of immovable rock were erected, creating mooring space for a large amount of both trading vessels and warships.\n\nThough seldom used by the fleets of [gondor|E], Serelond was able to withstand many a corsair raid due to its maritime fortifications and the excellent state of its arsenals, which could repair ships quickly when needed."

 # Annon Drúin
 building_type_wonder_annondrun: "Annon Drúin"
 #building_type_wonder_annondrun_desc: ""
 building_wonder_annondrun: "Annon Drúin"
 building_wonder_annondrun_desc: "Annon Drúin was one of the oldest sites of [numenorean|E] activity on Belfalas Bay, having been established in the early [secondage|E] by Aldarion the Mariner, who used the haven as an outpost in his unending search for ship timber. Like other settlements along the coast of northern Belfalas, it was fortified against the threat of indigenous raiders.\n\nFollowing the dissolution of the Guild of Venturers, Annon Drúin became a permanent settlement for the Faithful. Though it was ever a small town, never outgrowing its ancient walls, it grew somewhat in prominence during the reign of the Ship-kings."

 # Stone of Erech
 building_type_wonder_erech: "Stone of Erech"
 building_type_wonder_erech_desc: "A stone of mysterious origin, brought out of [numenor|E] by [isildur|E]."
 building_wonder_erech: "Stone of Erech"
 building_wonder_erech_desc: "Brought out of [numenor|E], the stone of Erech is a perfectly spherical black orb, half-submerged in the ground. What is above ground is easily as tall as a man. Upon this stone did the Men of the Mountains swear to fight for [isildur|E], and when they broke their oath, he cursed them with undeath."

 #Bar Morthil
 building_type_wonder_barmorthil_01: "Bar Morthil"
 #building_type_wonder_barmorthil_01_desc: ""
 building_wonder_barmorthil_01: "Beacon of Ulond"
 building_wonder_barmorthil_01_desc: "Built in [ageSA|E] 1912 to guide the ships of [numenor|E] around the dangerous cape of Ras Morthil. The beacon was kept by a warden who was at first appointed by the Guild of Venturers and later jointly by the administrations of Tharbad and Pelargir. \n\nThe warden had a small staff and a nominal garrison to keep watch on the indigenous population, but their appointments were short, and no permanent settlement was ever created."
 building_wonder_barmorthil_02: "Retreat of the Kings"
 building_wonder_barmorthil_02_desc: "A royal estate situated on the very tip of Andrast. It was the westernmost habitation in all of [gondor|E] at its height. At times the kings withdrew here for solitude or meditation, far from the courts of Osgiliath or Minas Anor. \n\nBar Morthil was founded by [isildur|E] & [anarion|E] in [ageSA|E] 3332 as a memorial to lost Westernesse. The westward-facing promontory on which the manor was built was considered to be a hallowed place because it offered the observer the most westerly vantage point for recalling the Land of Gift and the Meneltarma."

 # Osgiliath
 building_type_wonder_osgiliath_01: "Osgiliath"
 building_type_wonder_osgiliath_01_desc: "Osgiliath, once the jewel of [gondor|E] and seat of the royal government, has become a ruin. It will take great time and effort, but we should restore it!"
 building_wonder_osgiliath_01: "Ruins of Osgiliath"
 building_wonder_osgiliath_01_desc: "Osgiliath, once the jewel and capital of [gondor|E], has become a ruin abandoned by all its inhabitants. However, the ruins also serve as defensive fortifications."
 building_wonder_osgiliath_02: "Garrisons of Osgiliath"
 building_wonder_osgiliath_02_desc: "While still not fit for civilian habitation, Osgiliath now hosts a sizeable garrison of soldiers that have begun to rehabilitate the dilapidated buildings."
 building_wonder_osgiliath_03: "Rebuilding of Osgiliath"
 building_wonder_osgiliath_03_desc: "Slowly our citizens have begun to return to Osgiliath. The outer wall and outlying wards have begun to be restored, and trade has begun to pick up in the region."
 building_wonder_osgiliath_04: "Osgiliath Restored"
 building_wonder_osgiliath_04_desc: "Osgiliath, city of the Kings of [gondor|E], at last has been almost restored to its former glory. Dilapidated buildings have been repaired, roads replaced, and citizens fill the great marketplaces. The bridges across [anduin|E] are now slowly being rebuilt to their former splendour."
 building_wonder_osgiliath_05: "Osgiliath, Citadel of the Host of Stars"
 building_wonder_osgiliath_05_desc: "Osgiliath, so long in ruins, now stands once more as the greatest city of [gondor|E], eclipsing all others. The great bridges have been restored, and after great effort and summoning all the ingenuity of the heirs of Númenor, the Dome of the Stars has been wrought anew. A new age is dawning on Osgiliath, one of restored splendour and glory."
 building_type_wonder_osgiliath_original: "Osgiliath"
 building_wonder_osgiliath_original: "Osgiliath"
 building_wonder_osgiliath_original_desc: "Osgiliath, the Jewel of [gondor|E] and seat of the royal government, was founded by the sons of [elendil|E], [isildur|E] and [anarion|E]. The Dome of Stars, a wondrous marvel of [numenorean|E] architecture, rises at its centre - a true symbol of the glory and prosperity of the South Kingdom."

 # Walls of Linhir
 building_type_wonder_walls_linhir: "Walls of Linhir"
 building_type_wonder_walls_linhir_desc: "The walls of Linhir, ancient fortifications that protect the city and one of the main naval strongholds of central [gondor|E]."
 building_wonder_walls_linhir: "Walls of Linhir"
 building_wonder_walls_linhir_desc: "Linhir was founded by [anarion|E] in the year 3421 of the [secondage|E], on the site of an existing Faithful settlement on the banks of the Gilrain. A significant dockyard for the Royal Fleet, it is traditionally seen as the second city of Lebennin after Pelargir. \n\nSurrounding the city are the ‘[numenorean|E] walls,’ parts of which - including the great gate - predate the Downfall. Though built on a less impressive scale than other, more famous [gondorian|E] fortifications, the walls of Linhir still make the city a formidable redoubt and refuge from Corsair raids."
 building_wonder_citadel_of_linhir: "Citadel of Linhir"
 building_wonder_citadel_of_linhir_desc: "The central hub connecting the fortifications at Linhir is the citadel, situated near the town's harbour. Overlooking the many quays and walkways of the port, the citadel has been fashioned in the same [numenorean|E] architecture style as the much older walls that surround the city. The height of the ramparts has been raised to almost double its previous size, allowing its defenders to easily repel any siege from the seaside."

 # Ithilien
 building_type_wonder_henneth_annun: "Henneth Annûn"
 building_type_wonder_henneth_annun_desc: "The hidden refuge of the rangers of Ithilien, Henneth Annûn."
 building_wonder_henneth_annun: "Henneth Annûn"
 building_wonder_henneth_annun_desc: "#TOLKIENQUOTE "This is the Window of the Sunset, Henneth Annûn, fairest of all the falls of Ithilien, land of many fountains."#! - Faramir \n\nThe longest-lasting of all the refuges in Ithilien, Henneth Annûn was created by the Steward Turin II circa [ageTA|E] 2901 in response to orc incursions from [mordor|E]. It is still maintained and guarded as the headquarters of the Ithilien Rangers, even to this day. It is a hidden cave complex, whose entrance is guarded by a waterfall that flows into the forbidden pool."

 building_type_wonder_palace_of_ithilien: "Palace of Ithilien"
 building_type_wonder_palace_of_ithilien_desc: "The palatial dwelling of the Prince of Ithilien, bearing unparalleled gardens."
 building_wonder_palace_of_ithilien: "Palace of Ithilien"
 building_wonder_palace_of_ithilien_desc: "#TOLKIENQUOTE "And Aragorn gave to Faramir Ithilien to be his princedom, and bade him dwell in the hills of Emyn Arnen within sight of the City."#!\n\nThe seat of the Prince of Ithilien, the Palace of Ithilien within the hills of Emyn Arnen is a haven of beauty and relaxation, reflecting the realm of its prince. Many fine gardens are interwoven with the finely wrought stone buildings, made in the ancient [numenorean|E] style."

 #Cair Andros
 building_type_wonder_citadel_cairos_original: "$building_type_wonder_citadel_cairos_01$"
 building_type_wonder_citadel_cairos_original_desc: "$building_type_wonder_citadel_cairos_01_desc$"
 building_wonder_citadel_cairos_original: "$building_wonder_citadel_cairos_01$"
 building_wonder_citadel_cairos_original_desc: "$building_wonder_citadel_cairos_01_desc$"
 # Full version
 building_type_wonder_citadel_cairos_01: "Cair Andros"
 building_type_wonder_citadel_cairos_01_desc: "[Glossary('Cair Andros','cair_andros_gloss')] is an island standing in the center of Anduin, guarding the northernmost passage into Anórien. Its sheer cliffs and turbulent waters make it a natural point of defense, and it has been manned as such many times during [gondor|E]'s history."
 building_wonder_citadel_cairos_01: "The Citadel of Cairros"
 building_wonder_citadel_cairos_01_desc: "$building_type_wonder_citadel_cairos_01_desc$\n\nThe Citadel of Cairros was first established [ageTA|E] 1248 by Minalcar, later Romendacil II, regent to King Narmacil I, following his defeat of the Easterlings. It was the southernmost of a chain of fortifications along the Anduin, reaching as far north as the Limlight. The island was walled and a citadel and tower was constructed on the northern end to watch the road eastwards and act as a supply point for troops mustering in Anórien."
 building_wonder_citadel_cairos_02: "Decrepit Fortifications"
 building_wonder_citadel_cairos_02_desc: "$building_type_wonder_citadel_cairos_01_desc$\n\nOver time, while [gondor|E] has endured many attacks from the east, never has Cair Andros been upon the front lines. Relegated to the status of errand post and local garrison, the citadel of Cairos has received less upkeep and care than it might otherwise need. The walls are largely ruinous, but if manned, the surviving walls and towers will creat an additional barrier to any foe attempting to cross the Anduin into northern Gondor."
 building_wonder_citadel_cairos_03: "Rebuilt Citadel"
 building_wonder_citadel_cairos_03_desc: "$building_type_wonder_citadel_cairos_01_desc$\n\nIn the year [ageTA|E] 2901, Steward Túrin II again restored the dilapidated fortifications to protect Anórien against the growing [orcish|E] threat in Ithilien. It now serves as the first line of densnse of the Gondorian hearthlands, and a retreat and support point for the Rangers in Ithilien beyond. Manned and embattled with mighty fortifications, it secures the northern flank of [gondor|E] upon the [anduin|E]."




 ### ANGMAR WONDERS ###
 building_type_wonder_carn_dum_01: "Carn Dûm"
 #building_type_wonder_carn_dum_01_desc: ""
 building_wonder_carn_dum_01: "Carn Dûm"
 building_wonder_carn_dum_01_desc: "The dread fortress of [carndum|E], chief stronghold of the [witchkingshort|E] of [angmar|E]. Behind and below its icy towers and jagged walls lay myriad dungeons filled with endless horrors and echoing screams, a place where nightmares were made living flesh and living flesh rendered into the uncanny and unbodied. No captured thrall brought to Carn Dûm ever left alive, though it was rumoured that the [witchkingshort|E] would give no peace even to the dead, and by sorcerous enchantment dispatched their unquiet wights to sow horror among his foes.\n\nThe origins of Carn Dûm are mysterious. The [dunedain|E] knew not its origin, and many of them believed it built by the Witch-King himself to his own infernal designs. Whatever its beginnings, it was here that the Witch-King took up his abode in [ageTA|E] 1300 as part of a greater plan orchestrated by Sauron. Gathering many [orcs|E], evil [conceptracemen|E] and fell creatures, he built the cruel realm of [angmar|E], which he directed to a single purpose - the destruction of the [dunedainarnor|E]."

 building_type_wonder_carn_dum_ruin_01: "Carn Dûm"
 #building_type_wonder_carn_dum_ruin_01_desc: ""
 building_wonder_carn_dum_ruin_01: "Carn Dûm"
 building_wonder_carn_dum_ruin_01_desc: "The dread fortress of [carndum|E], chief stronghold of the [witchkingshort|E] of [angmar|E]. Behind and below its icy towers and jagged walls lay myriad dungeons filled with endless horrors and echoing screams, a place where nightmares were made living flesh and living flesh rendered into the uncanny and unbodied. No captured thrall brought to Carn Dûm ever left alive, though it was rumoured that the [witchkingshort|E] would give no peace even to the dead, and by sorcerous enchantment dispatched their unquiet wights to sow horror among his foes.\n\nThe origins of Carn Dûm are mysterious. The [dunedain|E] knew not its origin, and many of them believed it built by the Witch-King himself to his own infernal designs. Whatever its beginnings, it was here that the Witch-King took up his abode in [ageTA|E] 1300 as part of a greater plan orchestrated by Sauron. Gathering many [orcs|E], evil [conceptracemen|E] and fell creatures, he built the cruel realm of [angmar|E], which he directed to a single purpose - the destruction of the [dunedainarnor|E]."
 building_wonder_carn_dum_ruin_02: "Bones of Carn Dûm"
 building_wonder_carn_dum_ruin_02_desc: "The fortress of [carndum|E], once the capital of the dread realm of [angmar|E], now lies in ruins. Taking inspiration from [isildur|E]. The [dunedainnorth|E] repeated their forefathers' destruction of Barad-dûr. They left no stone unturned, no work unruined, and no wall standing. The vast prisons have been opened and the wights banished. The [witchkingshort|E]'s capital has been smote from the world, with only the pits of bone to mark the ruin."
 building_wonder_carn_dum_ruin_03: "Carn Dûm Restored"
 building_wonder_carn_dum_ruin_03_desc: "The dread fortress of [carndum|E], chief stronghold of the [witchkingshort|E] of [angmar|E]. Behind and below its icy towers and jagged walls lay myriad dungeons filled with endless horrors and echoing screams, a place where nightmares were made living flesh and living flesh rendered into the uncanny and unbodied.\n\nNo captured thrall brought to Carn Dûm ever left alive, though it was rumoured that the [witchkingshort|E] would give no peace even to the dead, and by sorcerous enchantment dispatched their unquiet wights to sow horror among his foes.\n\nThe origins of Carn Dûm are mysterious. The [dunedain|E] knew not its origin, and many of them believed it built by the Witch-King himself to his own infernal designs.\n\nWhatever its beginnings, it was here that the Witch-King took up his abode in [ageTA|E] 1300 as part of a greater plan orchestrated by Sauron. Gathering many [orcs|E], evil [conceptracemen|E] and fell creatures, he built the cruel realm of [angmar|E], which he directed to a single purpose - the destruction of the [dunedainarnor|E]."

 building_wonder_minas_formen_01: "Minas Formen"
 building_wonder_minas_formen_01_desc: "Minas Formen, the Tower of the North, was constructed by the [dunedainnorth|E] following their victory over the kingdom of Angmar to watch over the lands of the [witchkingshort|E] and consolidate their hold over the region."
 building_type_wonder_minas_formen_01: "Minas Formen"

 building_type_wonder_barad_gularan: "Barad Gúlaran"
 building_type_wonder_barad_gularan_desc: "This tower was raised by the Witch-king to study and refine his sorcerous powers. He would, from time to time, retire into Barad Gúlaran, to focus on creating devastating new spells with which to torment [arnor|E], especially during winter.\n\nOnly a select few acolytes are allowed to enter the tower and attend to their master's needs, should he require any. Very few men have ever seen the inside of Barad Gúlaran... and even fewer have left it alive."
 building_wonder_barad_gularan: "Barad Gúlaran"
 building_wonder_barad_gularan_desc: "$building_type_wonder_barad_gularan_desc$"

 building_type_wonder_dread_keep: "The Dread Keep"
 building_type_wonder_dread_keep_desc: "Raised by a cruel Angmarrim warlord in service to the [witchkingshort|E], the black, iron-crowned parapets of this keep were a sight that gave even the hardiest of [men|E] pause. It was said that countless pitiful prisoners were tortured in its vast dungeons, never to see the light of day again. From here, the merciless Angmarrim set their plans into motion to subjugate the entire [anduinvale|E] in the name of the Iron Crown of [angmar|E]."
 building_wonder_dread_keep: "The Dread Keep"
 building_wonder_dread_keep_desc: "Raised by a cruel Angmarrim warlord in service to the [witchkingshort|E], the black, iron-crowned parapets of this keep were a sight that gave even the hardiest of [men|E] pause. It was said that countless pitiful prisoners were tortured in its vast dungeons, never to see the light of day again. From here, the merciless Angmarrim set their plans into motion to subjugate the entire [anduinvale|E] in the name of the Iron Crown of [angmar|E]."

 ### SHIRE & BREELAND WONDERS ###
 building_type_wonder_prancing_pony: "The Prancing Pony"
 building_type_wonder_prancing_pony_desc: "The Prancing Pony is the famous inn of Bree, kept by the Butterbur family for generations. Known for its good ale and warm hearth, it offers rooms and comfort alike to both Big Folk and [hobbits|E]."
 building_wonder_prancing_pony: "The Prancing Pony"
 building_wonder_prancing_pony_desc: "#TOLKIENQUOTE: “Even from the outside the inn looked a pleasant house to familiar eyes. It had a front on the Road, and two wings running back on land partly cut out of the lower slopes of the hill, so that at the rear the second-floor windows were level with the ground. There was a wide arch leading to a courtyard between the two wings, and on the left under the arch there was a large doorway reached by a few broad steps. Above the arch there was a lamp, and beneath it swung a large signboard: a fat white pony reared up on its hind legs. Over the door was painted in white letters: THE PRANCING PONY by BARLIMAN BUTTERBUR.”#!\n\n#QUOTEDCHARACTER ― The Lord of the Rings, "At the Sign of the Prancing Pony"#!\n\nThe Prancing Pony in Bree is a long-standing inn at the crossroads of the East and North Roads. Managed for generations by the Butterbur family, it welcomes locals and travelers alike, offering food, drink, and rooms for both Big Folk and [hobbits|E]."

 building_type_wonder_great_smials: "Great Smials"
 building_type_wonder_great_smials_desc: "Perched on the hill above Tuckborough, the Great Smials are a vast, turf-roofed labyrinth of smials that serve as the Tooks’ family seat."
 building_wonder_great_smials: "Great Smials"
 building_wonder_great_smials_desc: "The Great Smials, the ancestral home of the Tooks, are a sprawling network of smials hollowed into a turf-covered hill above Tuckborough. The maze of tunnels, whose construction began in the [thirdage|E], has grown over the years, sprawling in more tunnels and holes. From the outside the green slope is punctuated by many round doors, while a scattering of slender chimneys and curls of smoke mark the many hearths within. Inside, low beamed corridors lead to cozy sitting-rooms with deep fireplaces, panelled studies lined with dozens of books, long communal halls, cool wine-cellars and well-stocked pantries which give the rooms a solid, lived-in character."

 building_type_wonder_brandy_hall: "Brandy Hall"
 building_type_wonder_brandy_hall_desc: "Brandy Hall is the ancestral home of the Brandybucks, a vast warren of smials delved into the side of Buck Hill in Bucklebury, at the heart of Buckland."
 building_wonder_brandy_hall: "Brandy Hall"
 building_wonder_brandy_hall_desc: "Brandy Hall, ancestral seat of the Brandybucks, is a vast warren of smials delved into the side of Buck Hill in Bucklebury, at the heart of Buckland. Originally built in the [thirdage|E], the clan enlarged and adorned the dwelling until the whole hill was honeycombed with [hobbit|E]-holes. Three great doors open upon its front, with many lesser doors to the sides, and near a hundred round windows looking out over the green slopes."

 building_type_wonder_bag_end: "Bag End"
 building_type_wonder_bag_end_desc: "Bag End is the ancestral home of the Baggins, a turf-capped [hobbit|E]-hole in the Hill at Hobbiton, marked by its green round door and neat garden. It is a roomy, elegant smial, famed for comfort and its extensive larders."
 building_wonder_bag_end: "Smial of Bag End"
 building_wonder_bag_end_desc: "#TOLKIENQUOTE: “In a hole in the ground there lived a Hobbit. Not a nasty, dirty, wet hole, filled with the ends of worms and an oozy smell, nor yet a dry, bare, sandy hole with nothing in it to sit down on or to eat: it was a Hobbit-hole, and that means comfort.”#!\n\n#QUOTEDCHARACTER ― The Hobbit, "An Unexpected Party"#!\n\nBag End is the ancestral home of the Baggins, an exemplar of everything that [hobbit|E]-holes aspire to be. Excavated in the [thirdage|E] into the top of the Hill at Hobbiton — at the end of Bagshot Row — the earth removed during construction was thrown over the hill, giving Bag End its turf-capped profile. The house has a green round door with a brass knob, many round windows, numerous well-built rooms, larders of near-legendary status, and a well-kept garden.\n\nThis smial offers the perfect combination of comfort, respectability, and quiet prosperity for the gentle people of the [shire|E]."
 building_wonder_bag_end_02: "Chief Shirriff's Base"
 building_wonder_bag_end_02_desc: "The Bag End of old has been repurposed as the Chief Shirriff’s personal office: the old green door is now reinforced, the garden trampled, and a crude placard proclaims the new authority. Inside, homely furnishings have been cleared for a stout plank table piled with ledgers, maps, and tools; orders and warrants cover the walls, while faded domestic touches make the new austerity feel all the more bitter."
 building_wonder_bag_end_03: "Restored Bag End"
 building_wonder_bag_end_03_desc: "Bag End is lovingly restored to its former warmth and comfort: the green round door gleams once more, the garden flourishes, and the rooms are refurnished with polished wood, bright carpets, and well-stocked larders. The smial regains its air of homely respectability, standing again as the most welcoming and prosperous [hobbit|E]-hole in Hobbiton."

 building_type_town_hole_hobbit: "Hobbit Administration"
 building_type_town_hole_hobbit_desc: "A cosy row of [hobbit|E]-holes where hearth and ledger meet: the smallfolk’s cheerful centres for petty administration and village affairs."
 building_town_hole_hobbit: "Town Hole"
 building_town_hole_hobbit_desc: "Set like a row of little burrows beneath the green, the Town Hole is where the [hobbit|E] Mayors keep their cheer and council. Here, amid round doors and smoking chimneys, not only are tales told and pipes filled, but all the modest administration of Hobbit life — the keeping of rolls, the settling of petty disputes, the issuing of licences for markets and fairs, and the recording of births and deeds — is carried out with a courteous nod and a cup of tea."
 building_type_mathom_society_01: "Hobbit Museology"
 building_type_mathom_society_01_desc: "[hobbits|E] traditionally collect and care for [mathoms|E]: gifted or retired trinkets, tools and curios gathered in Mathom-houses and traded through friendly exchanges. Curated by the Mathom Society, these buildings preserve these small treasures and their stories, turning humble domestic objects into the record-rooms of Hobbit memory, local gossip and gentle barter."
 building_mathom_society_01: "Mathom-house"
 building_mathom_society_01_desc: "A Mathom-house is a public museum where [mathoms|E] — gifted trinkets, retired tools, and domestic curios — are catalogued, displayed and interpreted for neighbours and visitors. Run by the Mathom Society, its rooms are arranged like cosy cabinets of community memory, where small [hobbit|E] histories are preserved, traded, and told aloud."
 building_mathom_society_02: "Headquarters of the Mathom Society"
 building_mathom_society_02_desc: "The Headquarters of the Mathom Society are the regional administrative and scholarly hub of [hobbit|E] museology: a dignified hall of offices, catalogued archives and reference cabinets where senior curators record provenance, adjudicate exchanges, and plan the network of [mathomhouses|E]. It serves as a centre for research, public talks and the gentle bureaucracy that keeps the community’s treasured curios properly preserved and passed on."
 building_type_shirriff_office_01: "Hobbit Militia"
 building_type_shirriff_office_01_desc: "Simple in form, essential in purpose: here patrols are mustered, names recorded, disputes settled, and the quiet peace of region maintained."
 building_shirriff_office_01: "First Shirriff's Office"
 building_shirriff_office_01_desc: "More than a room, the Office is the little council of local safety: here the First Shirriff draws up patrols and postings, records who serves and who is excused, hears petitions and settles quarrels, signs summonses and sends messengers. Plain tasks, perhaps, but it is here that the quiet business of keeping [hobbit|E] folk and ways secure is set in motion."
 building_shirriff_office_02: "Muster-house of the Watch"
 building_shirriff_office_02_desc: "Set into a gentle hill, the Muster-house is a squat, half-buried hall of timber and stone. Here the Watch keeps muster, assigns beats and watches, mends cloaks and staves, and records the names of those on duty. Simple and homely it may be, yet within its plain walls the quiet work of guarding the [hobbit|E] folk and their borders is done with solemn care."

