#  building_wonder_hidar_oasis_01_desc: "Deep in the Dune Sea, where the unending sand wastes of[GetGeographicalRegion('middleearth_harad_dunesea_mirroroffire').GetName] meet the toxic plains of the eroded Salt Sea that was once Lake Uhtyara, a hidden place of respite can be found. Nestled deep within the highlands of Dârsalan, where the deathly salt winds are tempered by a wall of coarse cliffs, a small oasis survives.\n\nAfter the erosion of Lake Uhtyara in the early [thirdage|E], Hidar is one of the few remaining permanent settlements in the land once known as [GetGeographicalRegion('middleearth_harad_dunesea_abrakhan').GetName]. Few [trans_haradric_merchants|E] pass by here, as all of the great trade routes seem to dodge this desolate region."
#  building_wonder_hidar_oasis_02: "Souk of Hidar"
#  building_wonder_hidar_oasis_02_desc: "Around the oasis, a sizeable settlement has sprung up. A rudamentary network of canals breathes life into the basin of Hidar, the one lonely city left in the harsh land of [GetGeographicalRegion('middleearth_harad_dunesea_abrakhan').GetName].\n\nThough far from a safe investment, some adventurous [trans_haradric_merchants|E] now brave the treacherous cliffs and barren wastes to take a shorter route in the pursuit of profit. But with prosperity come bandits, and Hidar's unique location in the middle of the basin makes it difficult to defend against any would-be invaders from the surrounding highlands."
