 #Dwarven Spears#
 building_type_dwarven_pike_barracks_01: "Pike Barracks"
 building_type_dwarven_pike_barracks_01_desc: "While the confines of the a delving are generally bereft of mounted riders to counter, [dwarves|E] have discovered another use for the spear wall as a means to deny access to a chokepoint."
 #building_dwarven_pike_barracks_01: "Defensive Formations Training"
 building_dwarven_pike_barracks_01: "Lockstep Formations"
 building_dwarven_pike_barracks_01_desc: "In the tight quarters of an underground tunnel, a spear formation can lock down an area and prevent entry into more vulnerable sections of a hold. By training speardwarves in this style of defense, they can maximize the effectiveness of their warriors."
 building_dwarven_pike_barracks_02: "A Keen Edge"
 building_dwarven_pike_barracks_02_desc: "[dwarven|E] craftsmen are renowned for their ability to hone a mere metal ingot into a lethal weapon of exacting sharpness. The edge of such a spear is able to pierce flesh and leather in a single thrust."
 building_dwarven_pike_barracks_03: "Reinforced Haft"
 building_dwarven_pike_barracks_03_desc: "Due to the use of iron bolts to bind the head of the spear to the haft, this allows the spear to hold up to more damage before needing repairs."
 building_dwarven_pike_barracks_04: "Longer Pikes"
 building_dwarven_pike_barracks_04_desc: "[dwarves|E] have enhanced their spear hafts such that they can support a increased length."
 building_dwarven_pike_barracks_05: "Pike Storage"
 building_dwarven_pike_barracks_05_desc: "Army camps have begun organizing a central stockpile for units on campaign. This cuts down of lost or damaged weapons and improves efficiency."
 building_dwarven_pike_barracks_06: "Pike Maintenance Kits"
 building_dwarven_pike_barracks_06_desc: "maintenance, kits including spare spearheads, allows [dwarven|E] pikemen to remain in the fray for longer periods of time without the blade chipping or growing dull."
 building_dwarven_pike_barracks_07: "Spear Guards"
 building_dwarven_pike_barracks_07_desc: "Small wing-like protrusions on either side of the spearhead allow for a speardwarf to redirect enemy attacks or force their weapons away."
 building_dwarven_pike_barracks_08: "Aggressive Tactics"
 building_dwarven_pike_barracks_08_desc: "While defensive formations are useful in the tunnels below, compact defensive formations suffer on the surface where archers can pelt spearmen with arrows. Coordiated spear charges preserve the strengths of a spear wall but remain mobile enough to mitigate ranged damage."
 building_dwarven_pike_barracks_09: "Shield Wall"
 building_dwarven_pike_barracks_09_desc: "With the addition of shields to spear formations are a boon to our military. Shields and spears can halt the strongest cavalry charge or shelter [dwarves|E] from arrows above."
 building_dwarven_pike_barracks_10: "Pike and Bolts"
 building_dwarven_pike_barracks_10_desc: "[dwarven|E] pikes squads have been supplemented with the odd crossbowdwarf. As the Archers rain death onto those below, the speardwarves form an unyielding wall of iron."

 #Dwarven Heavy Infantry#
 building_type_dwarven_hi_barracks_01: "Heavy Infantry Barracks"
 building_type_dwarven_hi_barracks_01_desc: "The small stature of the [dwarves|E] has left them without the means to strike and retreat as quickly as other races, by fielding units clad in heavy armor they can form an immovable rock upon which the enemy waves will crash."
 building_dwarven_hi_barracks_01: "Short Swords"
 building_dwarven_hi_barracks_01_desc: "By equipping heavily armored units with a short sword, they can wield a shield with one hand and thrust with the other."
 building_dwarven_hi_barracks_02: "Tip of the Sword"
 building_dwarven_hi_barracks_02_desc: "Our enemies shall break upon our armored vanguard, they shall advance in an unyielding wall of iron to reclaim what is ours."
 building_dwarven_hi_barracks_03: "Swordsmiths"
 building_dwarven_hi_barracks_03_desc: "The addition of dedicated swordsmiths allows for improved maintenance and honing of this unit's weapons. "
 building_dwarven_hi_barracks_04: "Squad Tactics"
 building_dwarven_hi_barracks_04_desc: "By forming dedicated squads within our lines we can allow for independent action and adaptation in the event that our line breaks."
 building_dwarven_hi_barracks_05: "Axedwarf Regiments"
 building_dwarven_hi_barracks_05_desc: "The addition of Axedwarves as auxiliaries provides the damage needed to topple much larger foes while the shield walls pin them."
 building_dwarven_hi_barracks_06: "Improved Armoring"
 building_dwarven_hi_barracks_06_desc: "The Blacksmiths of this hold have begun to slope armor in sch a way that most enemy attacks slide off it with ease."
 building_dwarven_hi_barracks_07: "Advanced Tactics"
 building_dwarven_hi_barracks_07_desc: "Commanders of this hold have been educated in the best way to utilize the combination of the shield wall and the Axedwarves, wringing the most effectiveness possible out of the combination."
 building_dwarven_hi_barracks_08: "Arms Honed and Sharp"
 building_dwarven_hi_barracks_08_desc: "Fierce training and maintenance has yielded a unit that is ready to defend the hold at a minutes notice."
 building_dwarven_hi_barracks_09: "Dwarven Steel"
 building_dwarven_hi_barracks_09_desc: "Blacksmiths of this hold have begun producing swords and axes woven with powerful magic and durability. The blades forged have a strange wavy design in the steel, the edges of these blades stay sharp for much longer than their less developed counterparts."
 building_dwarven_hi_barracks_10: "Iron Tortoise"
 building_dwarven_hi_barracks_10_desc: "The Tactical knowledge and material advancements have led the Dwarves to adopt an innovative new strategy. By interlocking shields on the sides and above the regiment, arrows and projectiles bounce off with nary a scratch. Rumor has it that one Iron Tortoise can withstand the attack of an entire [goblin|E] tribe."

 #Dwarven Archers#
 building_type_dwarven_archer_barracks_01: "Archer Barracks"
 building_type_dwarven_archer_barracks_01_desc: "The use of Archers is invaluable for the [dwarves|E], as the ranged attacks help defend against orc threats while reducing casualties."
 building_dwarven_archer_barracks_01: "Recurve Bows"
 building_dwarven_archer_barracks_01_desc: "This design helps make up for the small stature of [dwarves|E] by more efficiently storing power."
 building_dwarven_archer_barracks_02: "Specialized Wood"
 building_dwarven_archer_barracks_02_desc: "The use of wood specifically for making bows and arrows allows for stronger and longer lasting weapons."
 building_dwarven_archer_barracks_03: "Archer Tactics"
 building_dwarven_archer_barracks_03_desc: "By training Archers in firing as a group, the arrows are much more likely to hit their targets. The morale damage caused by this is also significant."
 building_dwarven_archer_barracks_04: "Personal Storage Cases"
 building_dwarven_archer_barracks_04_desc: "All Archers in this Hold have been issued their own personal boxes for storing bows, extra strings, and any other necessities. This shall ensure that the regiments will always be prepared, no matter where they fight."
 building_dwarven_archer_barracks_05: "Crossbows"
 building_dwarven_archer_barracks_05_desc: "The widespread use of Crossbows has greatly improved the fighting power of the Hold, as they require vastly less training and strength in order to achieve the same effectiveness as other bows."
 building_dwarven_archer_barracks_06: "Improved Maintenance"
 building_dwarven_archer_barracks_06_desc: "Quartermasters throughout the Hold have standardized Bow maintenance, and the use of tools like wax is now common practice."
 building_dwarven_archer_barracks_07: "Sharpened Arrowheads"
 building_dwarven_archer_barracks_07_desc: "Blacksmiths in this hold have begun phasing out the old Iron arrowheads in favor of newer Dwarven Steel. The Arrows will now be sharper than ever before, and be able to pierce the armour of nearly any foe."
 building_dwarven_archer_barracks_08: "Advanced Fletching"
 building_dwarven_archer_barracks_08_desc: "The creation of a Fletchers Guild has greatly increased the quality of feathers used in arrows and bolts. This results in much more accurate Archer fire."
 building_dwarven_archer_barracks_09: "Heat Resistance"
 building_dwarven_archer_barracks_09_desc: "Improved bow-making practices help increase the heat resistance of bows and arrows both in the Hold and on the field."
 building_dwarven_archer_barracks_10: "Steel Rain"
 building_dwarven_archer_barracks_10_desc: "The Archer regiments in this Hold have become so accurate at such long distances, that it is rare for enemies to ever notice the death that awaits them. When they do notice, the arrows are numerous enough that they fall down on their foes like a sudden Avalanche."

 #Dwarven Skirmishers#
 building_type_dwarven_skirmisher_barracks_01: "Skirmisher Barracks"
 building_type_dwarven_skirmisher_barracks_01_desc: "[dwarves|E] have a major weakness, as they have far less mobility due to their use of heavy weapons and armor. Skirmishers play a key role to address this; though they are not as equipped, they make use of their natural ability to sprint across short distances and chase their foes."
 building_dwarven_skirmisher_barracks_01: "Training Grounds"
 building_dwarven_skirmisher_barracks_01_desc: "An open area has been set up, and Skirmishers practice sprinting from one end to the other. This increases the fitness and mobility of the troops."
 building_dwarven_skirmisher_barracks_02: "Javelins"
 building_dwarven_skirmisher_barracks_02_desc: "Skirmishers are now equipped with Javelins, which can be used to harass enemy forces before any engagement."
 building_dwarven_skirmisher_barracks_03: "Improved Boots"
 building_dwarven_skirmisher_barracks_03_desc: "New footwear has been designed to accommodate the needs of the troops, and pursuing the enemy is easier than ever before."
 building_dwarven_skirmisher_barracks_04: "Skirmisher Tactics"
 building_dwarven_skirmisher_barracks_04_desc: "Skirmishers are now trained in envelopment tactics. This allows them to surround and destroy slower moving enemies."
 building_dwarven_skirmisher_barracks_05: "Falchions"
 building_dwarven_skirmisher_barracks_05_desc: "The Blacksmiths of this Hold on request have created lighter, thinner curved blades that can be held in one hand. These swords significantly increase the fighting capabilities of Skirmishers."
 building_dwarven_skirmisher_barracks_06: "Open Order"
 building_dwarven_skirmisher_barracks_06_desc: "The men have become skilled enough that they can operate on their own initiative, and are able to make quick decisions to turn the tide of battle."
 building_dwarven_skirmisher_barracks_07: "Standard Issue Daggers"
 building_dwarven_skirmisher_barracks_07_desc: "The troops have also been equipped with Dwarven Steel daggers, which enable more effective combat in close quarters."
 building_dwarven_skirmisher_barracks_08: "Advanced Surveys"
 building_dwarven_skirmisher_barracks_08_desc: "By scouting out the terrain beforehand, the Skirmishers maintain a great advantage in any battle."
 building_dwarven_skirmisher_barracks_09: "Field Supplies"
 building_dwarven_skirmisher_barracks_09_desc: "The Quartermasters of this Hold have prepared kits for the Skirmishers, which allow them to move and fight through even the roughest of terrain."
 building_dwarven_skirmisher_barracks_10: "Espionage Masters"
 building_dwarven_skirmisher_barracks_10_desc: "These Skirmishers have become unrivaled in their understanding of terrain, and are fast enough to utilize this knowledge to the greatest advantage. It is said that any enemy who dares challenge these troops is surrounded before they even have time to blink."

 #Dwarven Siege Engines#
 building_type_dwarven_siege_workshop_01: "Siege Workshop"
 building_type_dwarven_siege_workshop_01_desc: "In order to break through the immense fortifications that Delvings possess, [dwarves|E] have developed advanced Siege Engines capable of tearing down the Bastions of their foes."
 building_dwarven_siege_workshop_01: "Slings"
 building_dwarven_siege_workshop_01_desc: "Dwarven Engineers have devised a way to utilize slings in order to increase the length of the throwing arm, which allows for a greater range of fire."
 building_dwarven_siege_workshop_02: "Iron Sights"
 building_dwarven_siege_workshop_02_desc: "Two iron markers have been attached to the front and rear end of the Siege Engines. This helps the crew aim easier at longer distances."
 building_dwarven_siege_workshop_03: "Specialization"
 building_dwarven_siege_workshop_03_desc: "[dwarves|E] in this Hold have created different types of ammunition, with each type serving a unique purpose. Due to this, sieges have become much faster."
 building_dwarven_siege_workshop_04: "Improved Maintenance"
 building_dwarven_siege_workshop_04_desc: "After many years spent training, the [dwarves|E] have become extremely efficient in disassembling and reassembling siege engines for travel. They can also find any problems and fix them before they impact the war effort."
 building_dwarven_siege_workshop_05: "Controlled Demolition"
 building_dwarven_siege_workshop_05_desc: "The [dwarves|E] have perfected the art of besieging to a terrifying degree. It is said that these siege engines have become so powerful that they could bring down the walls of Barad-dûr itself."

 #Dwarven Economic Specialization#
 building_type_economic_specialization_01: "Specialization: Hold of Gold"
 building_type_economic_specialization_01_desc: "Our home stands on the threshold of unparalleled wealth and prosperity. Everyday, mines are dug deeper and more buildings are constructed for our people to live and work in. We are on the right track, but now it is time to do what Dwarves do best. It is time to begin to truly extract all the value we possibly can from our great mansion and see the wealth of our realm overflow."
 building_economic_specialization_01: "Dug-out Trading Squares"
 building_economic_specialization_01_desc: "It's not easy to trade when you live on a mountain. It's even harder when you live under one. While we cannot compromise the safety of our mansion by creating weaknesses, through great effort we can carve out carefully monitored tunnels to the outside, and create some manner of infrastructure that is designed in such a way to encourage the people of our home to congregate in this market square."
 building_economic_specialization_02: "A Conclave of Merchants"
 building_economic_specialization_02_desc: "With us opening ourselves to the world and allowing the wealth of our people to flow freely, the shrewdest among us have begun to accumulate vast amounts of wealth. Clearly these Dwarves understand trade, and our lord could only benefit from their wisdom. By constructing extravagant meeting halls and seating our lord at the top, we can bring these wise folk in to offer their advice on matters of trade and profit. With their help, everyone will be richer. "
 building_economic_specialization_03: "Gold Beyond Measure"
 building_economic_specialization_03_desc: "Our home has been utterly transformed. Our mansion has been filled with markets that are abuzz with the constant bustle of trade and finance, spurred on by the cleverly crafted infrastructure centralizing these locations. The wealth of Arda is brought from the depths below and sculpted into the grandest finery that is the desire of the world. Our great hoard is stacked to the ceiling, and even our people are achieving such wealth that many have small hoards of their own within their homes."

 #Dwarven Military Specialization#
 building_type_military_specialization_01: "Specialization: Hold of Steel"
 building_type_military_specialization_01_desc: "A change is being seen in the people of our mansion. Dwarves are no strangers to warfare, but even we can see that the world has been turning dark as of late. All around us we can see the signs of war to come, and the only way to survive is to ensure we can defeat our enemies in the field, all whilst maintaining the safety of our homes our brave soldiers leave behind. We must make sure that our outer holds conform to our new standards of quality, and centralize the army in this Mansion. Only by organizing a standard, professional army can we hope to survive the coming days."
 building_military_specialization_01: "Conscription Rolls"
 building_military_specialization_01_desc: "The first step to ensuring an organized, professional army is to ensure we have the Dwarves to fight in it. A quick census of our mansion and we can have the name of every Dwarf living here, their age, health and with a bit of extra effort, their skill with an axe or a spear. Once this is implemented, we'll be able to call upon those with the most promise to come and join the ranks of our army. "
 building_military_specialization_02: "Uniform Regiments"
 building_military_specialization_02_desc: "What good is having an army of Dwarves if we have nothing to arm them with? What good is a wall of spears if the Dwarf at the end has one a foot shorter than the others? And what good is a unit of axes if half are better at felling trees than hacking off limbs? Only by establishing strict regulations about the materials and designs of our arms and armor can we avoid these flaws. Specialty craft will be reserved for our greatest, and noble warriors, while our rank and file will be indistinguishable. While our soldiers might feel as if they are just another mass produced tool like their equipment, it will help keep them and their families alive, and none can argue with that."
 building_military_specialization_03: "The Weight of a Mountain"
 building_military_specialization_03_desc: "As our foes gather around us, it comes time to send our brave Dwarves off to war. With a rhythmic tune from their lock step mixed with long trumpet blares and slow beating drums, they sing a song of goodbye to those who gathered around to watch the parade. A song for their families. A song for their friends. A song for their loved ones. Those who many might never see again. But these warriors go not because they are forced to, but because they are brave enough to know that they must defend their homes. All so that those left behind can live in safety. It's never an easy choice, but these Dwarves carry a heavy burden on their shoulders. The fate of our home rests with them, and we shall give them everything for their sacrifice."

 #Dwarven Glory Specialization#
 building_type_glory_specialization_01: "Specialization: Hold of Marble"
 building_type_glory_specialization_01_desc: "Dwarves have built great and beautiful things many times before. And now we shall do so again. Through Dwarven ingenuity and diligence we shall build an eloquent home that incorporates the natural beauty of these caverns with the craftsmanship we know we possess. It will be a long and hard process to create a home that all would gaze upon and weep for with its beauty, but there is much to be said for the stubbornness of Dwarves."
 building_glory_specialization_01: "Expert Architecture"
 building_glory_specialization_01_desc: "To build something is a difficult task. To built it in such a way as to be deserving of the word 'beautiful' is even harder. And to do it in such a way as to not destroy the natural beauty around it, but enhance it is the hardest of all. But time is something that we have, and so a Dwarf can spend years making sure the stone is chiseled just right."
 building_glory_specialization_02: "The Great Halls"
 building_glory_specialization_02_desc: "Every mansion has its ruler, and every ruler needs their seat. Ours however, must stand higher than the rest, both literally and figuratively. All will stand in awe at the magnificence of our halls, filled with the highest pillars of the sturdiest rock, each lined with an ever burning torch. Atop the ceiling it shall be littered with sapphires and diamonds, and given just enough light to cause them to twinkle like stars in the night sky. And at the end of the hall sits a magnificent throne of gold, silver and stone atop perfectly even steps. Just right for those visiting to kneel upon and show their fealty."
 building_glory_specialization_03: "A Subterranean Paradise"
 building_glory_specialization_03_desc: "Where once there was a dark, dank cave, we have built a paradise. Our artisans have worked day and night to ensure that every building, bridge and path has been crafted to exquisite perfection. Quaint bridges span over the subterranean waters, their crystalline waters reflecting the radiant hues of light that spill in through cleverly dug out cracks in the rocky ceiling above. And in the center of it all is our grand palace. Intricately designed and excessive in all manners, it is a place the Fathers themselves would hold in esteem. We had to grind much stone to achieve this view, but it was all worth it."

 #Delvings#
 building_type_dwarven_depths_01: "Delving"
 building_type_dwarven_depths_01_desc: "Caverns, mansions and tunnels dug by beings unknowable carve out the very foundations of [arda|E] itself."
 building_dwarven_depths_01: "Subterranean Caverns"
 building_dwarven_depths_01_desc: "The inhabitants of this delving have all the basic space needed for life underground, but have not expanded deeper as of yet."
 building_dwarven_depths_02: "Initial Excavations"
 building_dwarven_depths_02_desc: "Due to population and material excess, additional storage and living areas have been constructive deeper into the caves"
 building_dwarven_depths_03: "Cave Surveys"
 building_dwarven_depths_03_desc: "The denizens have begun making efforts to settle the more far flung natural caverns. Expeditions are sent out annually to find new areas to settle."
 building_dwarven_depths_04: "To the Furthest Depths"
 building_dwarven_depths_04_desc: "The annual cave expeditions have ventured into the deepest natural caves in the mountain. This is the deepest level possible due to the lack of supports strong enough to counter the immense weight of the world above."
 building_dwarven_depths_05: "Stabilizations"
 building_dwarven_depths_05_desc: "[dwarven|E] technological advancements have allowed for the building of structural supports strong enough to withstand the weight of the mountains above. The sophistication of the hold allows for large-scale mining excavations into the bowels of the earth. "
 building_dwarven_depths_06: "To Scrape the Sky"
 building_dwarven_depths_06_desc: "Efforts have begun to expand not only downward but upwards towards the very peak of the mountain. A great tower crowns the summit in an unmatched symbol of the strength and prestige of the hold."
 building_dwarven_depths_07: "How Far Down is Down?"
 building_dwarven_depths_07_desc: "A strange fascination has gripped the denizens of the hold; many now believe it is their sacred duty to delve into the deepest possible caves of the hold. The enthusiasm has galvanized a new wave of prospectors and settlers to explore. Strike the earth!"
 building_dwarven_depths_08: "Everdownwards"
 building_dwarven_depths_08_desc: "The depth of this delving has reached a level unimaginable to any who dwell on the surface. A veritable maze of tunnels, towers, and halls fills the mountain, many who dwell at the deepest level live decades without venturing up to ground level."
 building_dwarven_depths_09: "Delving Greedily"
 building_dwarven_depths_09_desc: "The fascination with the depths has become a near mono-maniacal obsession among excavators of the hold. New regions are excavated with careless abandon, and while this carries its own risks, the rewards are substantial. "
 building_dwarven_depths_10: "Foundations of Stone"
 building_dwarven_depths_10_desc: "This hold reaches down to the very roots of the earth. Nameless beings stalk the caverns below. The stone itself cannot be chipped by the strongest pick. For all the denizens of this hold know, they have reached the very heart of the world."

#Erebor Mines#
 building_type_erebor_mines_01: "Mines of Erebor"
 building_type_erebor_mines_01_desc: "The mines of [erebor|E] are some of the most bounteous in [middleearth|E]. Countless stores of gems and seams of gold running like rivers through the rocky depths provide unfathomable wealth to the rulers of this province."
 building_erebor_mines_01: "First Mining Shafts"
 building_erebor_mines_01_desc: "Mining efforts have begun to yield fruit as veins are excavated near the surface; more intriguing, however, are the reports that this bounty is but a taste of the riches hidden in the bowels of the mountain."
 building_erebor_mines_02: "Depth Mining"
 building_erebor_mines_02_desc: "Work in the mines is well and truly underway; a rich flow of precious metals is extracted each day. Yet mysteries have begun to circulate in the deepest shafts of a queer and unearthly light shining through the cracks; perhaps the mountain's secrets are not yet exhausted..."
 building_erebor_mines_03: "Mines of $Thr_or$"
 building_erebor_mines_03_desc: "The Mines of $Thr_or$ are unmatched by the time of the [thirdage|E]; with the discovery of the [arkenstone|E] and no end of gold in sight, it seems that the realm of [erebor|E] can truly be counted among the great holds of yore."
 building_erebor_mines_04: "Grand Foundries"
 building_erebor_mines_04_desc: "Here the wealth of the earth is shaped and molded by the [dwarves|E] of [erebor|E]. The sheer wealth of the hold has left no shortage of envious eyes gazing on the mountain."
 building_erebor_mines_05: "Golden Foundries"
 building_erebor_mines_05_desc: "The gold... it sings to us, its glitter entrances us and drives us to gather more of it. Though some call this 'Dragon Sickness', they are fools; only the gold can buy our happiness."
 building_erebor_mines_06: "Golden Deeps of Erebor"
 building_erebor_mines_06_desc: "Gold, gold beyond measure... Beyond sorrow."

 #Surface Dwarf Buildings#
 building_type_dwarven_outpost_01: "Dwarven Outpost"
 building_type_dwarven_outpost_01_desc: "While [dwarves|E] have traditionally considered surface dwellings a last resort, it remains necessary to protect those unlucky few who make their living under the open sky."
 building_dwarven_outpost_01: "Palisade"
 building_dwarven_outpost_01_desc: "Local Axedwarves have procured the logs necessary for the construction of a simple palisade surrounding the settlement. This provides marginal safety from outside threats."
 building_dwarven_outpost_02: "Watchtowers"
 building_dwarven_outpost_02_desc: "Watchtowers dot the area around the settlement. Atop each stands a guard, their gaze ever fixed upon the horizon, fully capable of discerning friend from foe."
 building_dwarven_outpost_03: "Rudimentary Earthworks"
 building_dwarven_outpost_03_desc: "Miners and labourers have enclosed the palisade with a ditch. The excess dirt has been used to reinforce the lower sections of the palisade and prevent entry."
 building_dwarven_outpost_04: "Stone Walls"
 building_dwarven_outpost_04_desc: "The Dwarves of this outpost have seen fit to replace their simple palisade with a wall of stone and mortar. The only entrance has been reinforced with a mighty barred door."
 building_dwarven_outpost_05: "Trench Lines"
 building_dwarven_outpost_05_desc: "A system of ditches and trenches has been dug outside of the walls of this settlement. They both provide shelter from ranged attacks and act as a hindrance to any war machine that dares to besiege the settlement."
 building_dwarven_outpost_06: "Bunker Complex"
 building_dwarven_outpost_06_desc: "The nascent trenchlines have blossomed into a dizzyingly complex series of defences connected by a line of stone bunkers. Within these structures the [dwarves|E] can withstand any would-be besiegers."

#Dwarven Surface Farm#
 building_type_dwarven_surface_farm_01: "Dwarven Surface Farm"
 building_type_dwarven_surface_farm_01_desc: "The [dwarven|E] aversion to surface dwelling is well-known; nevertheless, a few less fortunate Dwarves make their living using their meager agricultural acumen."
 building_dwarven_surface_farm_01: "Planting Rows"
 building_dwarven_surface_farm_01_desc: "The [dwarves|E] in this settlement have begun organizing their agricultural efforts into larger organized rows."
 building_dwarven_surface_farm_02: "Wells"
 building_dwarven_surface_farm_02_desc: "Rudimentary irrigation has been dug for farmers to draw water from a series of wells."
 building_dwarven_surface_farm_03: "Dwarf-Drawn Plows"
 building_dwarven_surface_farm_03_desc: "As [dwarves|E] are notoriously reluctant to domesticate animals, special harnesses have been fashioned that allow a team of two Dwarves to pull a plow around the field, albeit with less efficiency than a team of oxen."
 building_dwarven_surface_farm_04: "Efficient Fertilizers"
 building_dwarven_surface_farm_04_desc: "Observations of the outpost's neighbors have allowed for [dwarven|E] farmers to discover more easily accessible and efficient fertilization."
 building_dwarven_surface_farm_05: "Efficient Irrigation"
 building_dwarven_surface_farm_05_desc: "The establishment of dedicated channels and artificial estuaries has boosted crop yields among the [dwarven|E] farms in the region. "
 building_dwarven_surface_farm_06: "Dwarven Vineyards"
 building_dwarven_surface_farm_06_desc: " The labour and ingenuity of the outpost have culminated in farming complexes that stand among the most esteemed farms in the realms of men. The liquor produced from the fruits in these vast fields is said to possess a unique terroir quite unlike any produced elsewhere."

#Dwarven Markets#
 building_type_dwarven_market_01: "Dwarven Market"
 building_type_dwarven_market_01_desc: "Dwarven surface settlements can not sustain themselves on their labour alone, they require a steady trickle of goods and manpower from proper holds to break even."
 building_dwarven_market_01: "Bartering System"
 building_dwarven_market_01_desc: "A formalized bartering system has been established to account for the lack of currency in their settlement."
 building_dwarven_market_02: "Weights and Measures"
 building_dwarven_market_02_desc: "A system of weights and measures has been established to judge the quality of goods in the market. This is marred by the insistence on local weights unrelated to other trade systems."
 building_dwarven_market_03: "Minor Trade Hub"
 building_dwarven_market_03_desc: "A semi-steady flow of trade goods runs through the market; craftsdwarves and farmers sell their excess in various stalls."
 building_dwarven_market_04: "Standardized Weights and Measures"
 building_dwarven_market_04_desc: "The idiosyncratic system of local weights has been stamped out, and a system of standardized measurements has been implemented. This allows for smoother trade with both dwarven merchants and outsiders. "
 building_dwarven_market_05: "Trade Caravans"
 building_dwarven_market_05_desc: "A hub has been established to facilitate the trade flowing to and from the outposts. The establishment of [dwarven|E] caravans has entrenched the outpost more deeply in the local trading ecosystem. "
 building_dwarven_market_06: "Notable Trade Center"
 building_dwarven_market_06_desc: "The outpost has thoroughly enmeshed itself in all trade coming through the region. Their connections are said to stretch far, from Lokhas-Drus to Lindon."

#Dwarven Pit Mine#
 building_type_dwarven_pit_mine_01: "Pit Mines"
 building_type_dwarven_pit_mine_01_desc: "A pit mine can supplement the income of an outpost bereft of any notable precious mineral deposits by prioritizing quantity over quality."
 building_dwarven_pit_mine_01: "Sifting Sieves"
 building_dwarven_pit_mine_01_desc: "Sieves are composed of a fine mesh screen that uses water to allow silt and sediment to pass through while any precious minerals remain. This allows for more efficient mining, requiring less dwarf-power for the same amount of labour."
 building_dwarven_pit_mine_02: "Foremen"
 building_dwarven_pit_mine_02_desc: "By designating a specific foreman to oversee the excavation, the outpost can coordinate the mining effort more effectively."
 building_dwarven_pit_mine_03: "Better tools"
 building_dwarven_pit_mine_03_desc: "Reinforcements to the shovels and tools used by the miners of this outpost allow for them to work longer hours without the need for maintenance. Whilst this may cost the outpost gold in the short-term, the prospect of less busywork is too enticing to ignore..."
 building_dwarven_pit_mine_04: "Fire-Setting"
 building_dwarven_pit_mine_04_desc: "'Fire-Setting' is a technique where bonfires are lit next to a stone wall before cold water is thrown on it. The ensuing thermal change causes great fissures to appear in stone, making it far easier to mine."
 building_dwarven_pit_mine_05: "The Yawning Abyss"
 building_dwarven_pit_mine_05_desc: "The dig site now encompasses a large plot of land outside the city walls, merging all the previous excavations into one large open pit. The labourers raise their voices in hymns to Mahal as their picks and sieves form a melody of labour."
 building_dwarven_pit_mine_06: "Cranes and Pullies"
 building_dwarven_pit_mine_06_desc: "A crane and pulley system allows for the miners to heave great clumps of rock and earth up from the depths. The earth is then broken apart and sifted at the work camps circling the pit."
 building_dwarven_pit_mine_07: "Sluice Gates"
 building_dwarven_pit_mine_07_desc: "Sluice gates have been erected to control the flow of water to and from the dig site. This allows for the sifters and Fire-Setters to continue their work without any need for delays."
 building_dwarven_pit_mine_08: "A Pockmark on the Face of Arda"
 building_dwarven_pit_mine_08_desc: "The mine's impact on the land is nearly omnipresent. Great towers of smoke reach the horizon as any metal excavated is forged into ingots, brackish waters from the mines flood the estuaries, and the clanging can be heard at all hours of the day. Yet despite the detractors, this mine stands as a testament to the resilience of its inhabitants."

#Dwarven Forges#
 building_type_dwarven_surface_forge_01: "Dwarven Forge"
 building_type_dwarven_surface_forge_01_desc: "Dwarves of all stripes are renowned for their metallurgy. An outpost requires all manner of forgework from struts to spears."
 building_dwarven_surface_forge_01: "Local Blacksmith"
 building_dwarven_surface_forge_01_desc: "Skilled craftsdwarves have been requisitioned to provide for the needs of the outpost, fashioning all manner of sword and spear that one could desire."
 building_dwarven_surface_forge_02: "Fine Hafts"
 building_dwarven_surface_forge_02_desc: "The Dwarves have begun to furnish their blades with lighter weight hafts and hilts. This preserves the cutting power while allowing for faster swings."
 building_dwarven_surface_forge_03: "Standardized Molds"
 building_dwarven_surface_forge_03_desc: "Standardized molds allow [dwarven|E] blacksmiths of the outpost to produce weapons and tools of consistent quality. Many [dwarves|E] still prefer to wield artisan weaponry if they can afford it, however. "
 building_dwarven_surface_forge_04: "Great Bellows"
 building_dwarven_surface_forge_04_desc: "Larger bellows have begun furnishing the smithies of this outpost; the increased heat allows for new alloys to be used in the crafting of arms and armor."
 building_dwarven_surface_forge_05: "Blast Furnances"
 building_dwarven_surface_forge_05_desc: "Blast furnaces use alchemical processes to render iron ores into pure iron. This 'Pig Iron' is a vital ingredient in the creation of steel. This allows the outpost to streamline the process of steel crafting for their troops."
 building_dwarven_surface_forge_06: "Rippled Steel"
 building_dwarven_surface_forge_06_desc: " Advancements in forging processes and equipment have allowed the local blacksmiths to produce a stronger variant of common steel. The process lends the blades forged an unnatural durability and dark wavy ripples in the metal."

#Surface Workshop#
 building_type_dwarven_surface_workshop_01: "Dwarven Surface Workshop"
 building_type_dwarven_surface_workshop_01_desc: "A proper outpost requires weapons of war to smite any [orcish|E] strongholds in the region. This outpost will allow for a smoother expansion of the outpost's control as nearby Orcish forts are dealt with."
 building_dwarven_surface_workshop_01: "Fledging Workshops"
 building_dwarven_surface_workshop_01_desc: "A workshop has been designated for the construction of siege engines to enhance the outpost's military. Journeydwarves from across the region flock to the workshop to create all manner of siegeworks."
 building_dwarven_surface_workshop_02: "Sapper's Guilds"
 building_dwarven_surface_workshop_02_desc: "Sappers attached to the army have begun to organize into guilds where they pool their knowledge for the betterment of their craft. "
 building_dwarven_surface_workshop_03: "Firing Ranges"
 building_dwarven_surface_workshop_03_desc: "A firing range has been constructed to allow soldiers to train in the operation of siege weapons. This practice allows for better marksdwarves and more accurate targeting."
 building_dwarven_surface_workshop_04: "Surface Siege Engineers"
 building_dwarven_surface_workshop_04_desc: "The guilds at this hold have established a small school to train prospective engineers in the art of sieging on the surface as compared to the halls of their kin."
 building_dwarven_surface_workshop_05: "An Alchemical Edge"
 building_dwarven_surface_workshop_05_desc: "Some within the guilds have begun to experiment with alchemical solutions that may destroy even the strongest wall. From acids that can melt stone to serums that focus the mind, each new concoction provides new opportunities for the outpost's armies."
 building_dwarven_surface_workshop_06: "Model Cities"
 building_dwarven_surface_workshop_06_desc: "The capabilities of the besiegers have culminated with the construction of small-scale replicas of whatever fort the army is currently besieging. This has improved the efficacy of the siege units as it allows for the visualization of each structure's weak point."

#Dwarven Surface Mustering Grounds#
 building_type_dwarven_mustering_grounds_01: "Dwarven Mustering Grounds"
 building_type_dwarven_mustering_grounds_01_desc: "A local guard needs to be organized to ensure safety from [orcish|E] raids. By prioritizing the training of light infantry tactics, the outpost can quickly react to potential threats."
 building_dwarven_mustering_grounds_01: "A Designated Mustering Point"
 building_dwarven_mustering_grounds_01_desc: "A space has been cleared outside the settlement for the training and mustering of soldiers."
 building_dwarven_mustering_grounds_02: "Weapon Storehouses"
 building_dwarven_mustering_grounds_02_desc: "A stockpile of weapons has been set aside for furnishing the hands of skirmishers and the odd levy. With spear and bow, the [dwarves|E] march in defense of their surface home."
 building_dwarven_mustering_grounds_03: "Militia Drills"
 building_dwarven_mustering_grounds_03_desc: "Drills have begun to whip the substandard soldiers guarding this outpost into something resembling a proper [dwarven|E]n army. The regiment's lack of heavy armor draws the scorn of the mountain [dwarves|E], but their ease of maneuverability is undeniable."
 building_dwarven_mustering_grounds_04: "Forced March"
 building_dwarven_mustering_grounds_04_desc: " Drill instructors have begun forcing their units to embark on arduous treks in their combat gear to get them acclimated to the weight. Every drop of sweat shed during training prevents a drop of blood lost in battle."
 building_dwarven_mustering_grounds_05: "Wargames"
 building_dwarven_mustering_grounds_05_desc: "As recruits advance, gone are the days of monotonous drilling into the small hours of the night. In their place a trial of combat pits veteran soldiers against the new recruits in mock battles. Instincts are honed and friendships forged in the crucible of combat."
 building_dwarven_mustering_grounds_06: "Strike Like Lightning"
 building_dwarven_mustering_grounds_06_desc: "Dwarven commanders of this outpost practice the innovative strategy wholly distinct from their subterranean kin, favoring rapid deployment and decisive strikes over defensive walls. Dubbed 'Ulkhudlukhd adhur' or 'Lightning Strike' by its advocates, it has proven to be a devastatingly effective form of warfare. Many an [orcish|E] army has been routed as they mustered by a surprise attack by these forces."

#Dwarven Tavern#
 building_type_dwarven_tavern_01: "Dwarven Taverns"
 building_type_dwarven_tavern_01_desc: "Alcohol forms the cornerstone of Dwarven civilization, allowing a Dwarf to avoid the sad fate of drinking alone."
 building_dwarven_tavern_01: "Local Watering Hole"
 building_dwarven_tavern_01_desc: "The Dwarves of this hold have established a tavern capable of fulfilling the bare necessities required to sustain a Dwarf."
 building_dwarven_tavern_02: "Roadside Inns"
 building_dwarven_tavern_02_desc: "Roadside inns have been constructed to house travelers and merchants journeying through the settlement. The additional revenue will allow for this investment to pay itself back over time."
 building_dwarven_tavern_03: "Breweries"
 building_dwarven_tavern_03_desc: "Brewmasters labour day and night in front of colossal distilling tanks. Using the labours of the forests and fields, a bevy of fine liquors of all varieties are produced."
 building_dwarven_tavern_04: "Keg Storage"
 building_dwarven_tavern_04_desc: "The construction of dedicated storage allows for the aging of various alcohols brewed by the Craftsdwarves. The days of swill and grog are behind them."
 building_dwarven_tavern_05: "Exotic Distilleries"
 building_dwarven_tavern_05_desc: "Exotic ingredients borne upon the backs of far-flung merchants provide rare opportunities for drink experimentation. Bubbling beakers and colorful cauldrons leave the mouths watering and throats parched for miles surrounding the Brewhalls."
 building_dwarven_tavern_06: "Crossroads of Continents"
 building_dwarven_tavern_06_desc: "The taverns of this settlement stand at the conflux of trade and adventure. Each day more and more bright-eyed and bushy-tailed wanderers pass through on the way to parts unknown. In these halls, parties of prospective heroes band together to right wrongs and make safe the realms of the virtuous."

#Dwarven Logging#
 building_type_dwarven_forestry_01: "Dwarven Foresty Camps"
 building_type_dwarven_forestry_01_desc: "While most Dwarves prefer to shape stone, the realities of a surface settlement often leave wood as the most readily available source of construction material. In places of particular abundance, lumber yards are established to extract the maximum amount of utility from [yavannacharacter|E]'s bounty."
 building_dwarven_forestry_01: "Saw Pits"
 building_dwarven_forestry_01_desc: "The use of saw pits necessitates the use of two Handydwarves; one is perched atop a log whilst the other stands in a pit below. In unison, they saw through the log using a two-handed whipsaw. Despite the efficiency of the process, the labour remains tiring, demanding, and dangerous."
 building_dwarven_forestry_02: "Controlled Burnings"
 building_dwarven_forestry_02_desc: "Dwarves at this logging camp have adopted a strategy of lighting controlled fires to burn through the most dense of thickets. The ashes of these fires provide a fine fertilizer and more land cleared for settlement."
 building_dwarven_forestry_03: "Fine Axes"
 building_dwarven_forestry_03_desc: "Advancements in the production of wood axes have allowed the [dwarves|E] of this settlement to harvest a greater amount of lumber individually. To while away the long hours, Lumberdwarves compose a bevy of bawdy songs to lift their spirits."
 building_dwarven_forestry_04: "Woodworking Workshops"
 building_dwarven_forestry_04_desc: "The fruits of the lumber mills make their way to the nearby workshops where carpenters refine it into all manner of finished goods. Dwarven chairs are known for their durability, if not their beauty."
 building_dwarven_forestry_05: "Water-Wheel Sawmills"
 building_dwarven_forestry_05_desc: "By harnessing the natural power of nearby streams, the inefficient sawpit can be replaced by a sawmill. The water wheel raises the saw blade up and down as the workers feed logs onto the track, thus removing the need for handsaws."
 building_dwarven_forestry_06: "Industrial Logging"
 building_dwarven_forestry_06_desc: "Where once a pristine forest sat, now a hub of industry roars. Tree by tree, the primeval wilderness is hewn and shaped to fit the needs of its new masters. The constant flow of wood fuels construction within the settlement and with all that trade with it."

#Goats#
 building_type_goat_pastures_01: "Dwarven Ram Ranches"
 building_type_goat_pastures_01_desc: "The Dwarves of the Iron Hills have the distinction of being the only [dwarves|E] to domesticate animals. The Longbeards have domesticated the mountain goats native to the area and utilize them for work and war in equal measure."
 building_goat_pastures_01: "Grazing Fields"
 building_goat_pastures_01_desc: "The Dwarves of these hills have established grazing fields for the newly introduced goat farms. The goats roam free during the day and return to the temporary shelters that have been arranged by night."
 building_goat_pastures_02: "Goat-Drawn Plows"
 building_goat_pastures_02_desc: "The traditional dwarf-drawn plows have been phased out in the vicinity of the ranches. In its place, a harness is used to utilize the superior strength of the goats to accomplish all manner of agricultural work, with the added benefit of strengthening the rams."
 building_goat_pastures_03: "Fence and Paddocks"
 building_goat_pastures_03_desc: "Fences and padlocks have been constructed on the periphery of the grazing fields to protect against predators and to keep track of the growing herds of goats."
 building_goat_pastures_04: "Goatshoes"
 building_goat_pastures_04_desc: "By adapting the human horseshoes to fit goats, the hooves of the goats are protected from excessive wear by the crags and hills. This allows the ranchers to work the rams harder and longer without fear of injury."
 building_goat_pastures_05: "Selective Breeding"
 building_goat_pastures_05_desc: "By encouraging breeding of the finest goats of each generation, a rancher can encourage desirable traits in their livestock. Bigger frames, greater stamina, and fearsome aggression are all noted and selected for in pursuit of the ultimate beast of war."
 building_goat_pastures_06: "Goat Armor"
 building_goat_pastures_06_desc: " A special training program has been implemented at the ranches to acclimate the goats to the burden of plate. This will provide any war host using these goats a force to be reckoned with, provided they can pay the additional fee for the training."
 building_goat_pastures_07: "Racing Track"
 building_goat_pastures_07_desc: "A racing track has been cleared to allow for competitions between local ranches. Besides the entertainment provided to the common dwarf, this exercise pushes the beasts to greater heights. The increase in speed provides a boon on the battlefield, allowing for masterful flanks and cunning strikes."
 building_goat_pastures_08: "Beasts of War"
 building_goat_pastures_08_desc: "The rams born at these ranches are now wholly distinct from their native kin. Thick, corded muscles coil beneath their hides as they charge through danger that a lesser beast would balk at. On these ranches, ram and rider act with one mind to smite the enemies of the hold."


 ### Crafting Mines ###
 building_type_iron_mines_01: "Iron Mines"
 building_type_iron_mines_01_desc: "Iron, a stalwart metal, forms the backbone of Middle-earth's metallurgy. Renowned for its strength and versatility, iron is the smith's choice for crafting an array of tools, weapons, and implements essential for everyday life."
 building_type_tin_mines_01: "Tin Mines"
 building_type_tin_mines_01_desc: "Tin, soft and malleable, plays a pivotal role in the alchemy of bronze. Scarcer than its copper companion, tin's scarcity lends it an air of exclusivity, contributing to its esteemed status among craftsmen and artisans."
 building_type_copper_mines_01: "Copper Mines"
 building_type_copper_mines_01_desc: "Copper, easily wrought and foundational to bronze production, stands as one of civilization's bedrocks. Its adaptability makes it a mainstay in the creation of tools, weapons, and artistic endeavors, shaping the world with its enduring utility."
 building_type_lead_mines_01: "Lead Mines"
 building_type_lead_mines_01_desc: "Lead, an easily malleable metal, may not bring great wealth, but its practical applications are manifold. From mundane objects to protective coatings, lead finds its place in the crafting of both the mundane and the esoteric."
 building_type_silver_mines_01: "Silver Mines"
 building_type_silver_mines_01_desc: "Silver, a luminous metal, possesses an otherworldly beauty and has long been associated with mystical properties. Revered for its elegance, silver shines in the creation of intricate jewelry, great artifacts, and objects of enchantment."
 building_type_gold_mines_01: "Gold Mines"
 building_type_gold_mines_01_desc: "Gold, a timeless symbol of wealth, has been valued Middle-earth since ancient times. Unaffected by the passage of years, gold gleams eternally, a testament to its enduring allure. As a byword for prosperity, it is coveted and treasured by all who seek opulence."
 building_type_mithril_mines_01: "Mithril Mines"
 building_type_mithril_mines_01_desc: "[metal_mithril|E], the rarest metal in existence, possesses legendary qualities. It could be beaten like copper, and polished like glass; and the [dwarves|E] could make of it a metal, light and yet harder than tempered steel. Its beauty was like to that of common silver, but the beauty of mithril did not tarnish or grow dim."
 building_type_quartz_mines_01: "Quartz Mines"
 building_type_quartz_mines_01_desc: "Quartz, a crystalline gem, dazzles with its clarity and brilliance. Revered for its purity, quartz finds use in both practical and mystical applications, from ornamental carvings to the creation of magical artifacts."
 building_type_peridot_mines_01: "Peridot Mines"
 building_type_peridot_mines_01_desc: "Peridot, a radiant green gem, captures the essence of nature's beauty. Prized for its vibrant hue, peridot adorns jewelry and accessories, symbolizing renewal and vitality in the hearts of those who wear it."
 building_type_onyx_mines_01: "Onyx Mines"
 building_type_onyx_mines_01_desc: "Onyx, a dark and enigmatic gem, exudes an aura of mystery. Its deep black hue lends itself to the crafting of exquisite jewelry and artifacts associated with the arcane. Onyx is often chosen to express elegance with an undertone of the unknown."
 building_type_amethyst_mines_01: "Amethyst Mines"
 building_type_amethyst_mines_01_desc: "Amethyst, a regal purple gem, is steeped in symbolism and mystique. Associated with sobriety and clarity of thought, amethyst graces jewelry, crowns, and talismans as a symbol of wisdom and inner strength."
 building_type_ruby_mines_01: "Ruby Mines"
 building_type_ruby_mines_01_desc: "Ruby, a fiery red gem, embodies passion and vitality. Revered for its intense hue, ruby adorns the regalia of kings and warriors, symbolizing courage, love, and the relentless pursuit of one's goals."
 building_type_sapphire_mines_01: "Sapphire Mines"
 building_type_sapphire_mines_01_desc: "Sapphire, a cool blue gem, captivates with its serene beauty. Long associated with wisdom and divine favor, sapphire graces the jewelry of scholars, rulers, and mystics, reflecting the calm strength within."
 building_type_emerald_mines_01: "Emerald Mines"
 building_type_emerald_mines_01_desc: "Emerald, a lush green gem, evokes the verdant wonders of Middle-earth. Symbolizing rebirth and growth, emerald is cherished for its rich color, adorning the crowns and jewelry of those who seek harmony and prosperity."
 building_type_diamond_mines_01: "Diamond Mines"
 building_type_diamond_mines_01_desc: "Diamond, the hardest gem, sparkles with unparalleled brilliance. Representing endurance and invincibility, diamonds are prized for their rarity and resilience. Adorning the most exquisite creations, diamonds endure as enduring symbols of eternal love and unyielding strength."

