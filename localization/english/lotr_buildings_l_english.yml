 building_settlement_01: "Quiet Villages"
 building_settlement_01_desc: "Humble hamlets and villages dot the landscape, home to hardy settlers braving the elements and establishing a foothold in this wild land."
 building_settlement_02: "Lonely Towns"
 building_settlement_02_desc: "Small towns have begun to grow across the land, attracting more people as their inhabitants begin to conquer the wilds."
 building_settlement_03: "Bustling Colony"
 building_settlement_03_desc: "Well-established settlements buzz with activity and excitement as the last remnants of the Wilderness are tamed."

