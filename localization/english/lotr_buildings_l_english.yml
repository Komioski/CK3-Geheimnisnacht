 building_spider_nest: "Spider Nests"
 building_spider_nest_desc: "The Children of Ungoliant, giant and fell spiders, make their home in the shadows and blight these lands. In the darkness they weave their webs, willing wanderers to stray into their traps."
 building_type_spider_nest: "Spiders"
 building_spider_nest_cleared: "Spiders Purged"
 building_spider_nest_cleared_desc: "The eight-legged blight has been purged, banished from their dark homes, making it safer to roam these lands.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_scorpion_bed: "Giant Scorpion Beds"
 building_scorpion_bed_desc: "The Giant Scorpions are an elusive and fiercely territorial species of the Dune Sea, often settling near limited water sources."
 building_type_scorpion_bed: "Giant Scorpions"
 building_scorpion_bed_cleared: "Giant Scorpions Banished"
 building_scorpion_bed_cleared_desc: "The Giant Scorpions are no more, they have been killed or driven off, leaving the colony free to grow and prosper.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_wolf_den: "Wild Wolves"
 building_wolf_den_desc: "Wild packs of wolves roam these lands, stalking and preying on those brave or foolish enough to wander through their territory."
 building_type_wolf_den: "Wolves"
 building_wolf_den_cleared: "Wolves Subdued"
 building_wolf_den_cleared_desc: "The wolves that once terrorised these lands have been subdued and driven away, making it safer for the new settlements growing in the area.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_bear_den: "Bear Dens"
 building_bear_den_desc: "Great bears claim this land as their home, fiercely guarding their territory and hunting grounds from any intruder."
 building_type_bear_den: "Bears"
 building_bear_den_cleared: "Bears Subdued"
 building_bear_den_cleared_desc: "The wild bear population that once roamed these lands has been hunted or driven away, with only a few remaining in the wildest corners of the province.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

#  building_troll_cave: "Troll Cave"
#  building_troll_cave_desc: "Deep within the shadowy woods, where the air is thick with moss and decay, lies the lair of the [trolls|E] - a dank cave network filled with bioluminescent fungi and the remnants of past victims, where the Trolls wait in darkness for unsuspecting travelers to stumble into their domain."
#  building_type_troll_cave: "Troll Cave"
#  building_troll_cave_cleared: "Troll Cave Cleared"
#  building_troll_cave_cleared_desc: "The reports of these menacing creatures have dwindled, suggesting that our intensified security measures have indeed proven effective. Whatever these beings were, they are now gone.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 #building_ghosts: "Wandering Wraiths"
 #building_ghosts_desc: "Undead spirits stalk this land with total abandon, tainting the very air with their evil presence."
 #building_type_ghosts: "Wraiths"
 #building_ghosts_cleared: "Wraiths Banished"
 #building_ghosts_cleared_desc: "The fell spirits that haunted these lands have been banished, their evil left as nothing more than a memory of the local populace and ghost stories whispered between children at night.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_ghosts: "Restless Spirits"
 building_ghosts_desc: "Restless spirits are said to haunt this land, tainting the very air with their evil presence and striking fear into any who dare to intrude."
 building_type_ghosts: "Ghosts"
 building_ghosts_cleared: "Spirits Banished"
 building_ghosts_cleared_desc: "The fell spirits that supposedly haunted these lands have vanished, their evil influence left as nothing more than a memory of the local populace and ghost stories whispered between children at night.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"


 building_dragon_attack: "Dragon Territory"
 building_dragon_attack_desc: ""My armour is like tenfold shields, my teeth are swords, my claws spears, the shock of my tail is a thunderbolt, my wings a hurricane, and my breath death!""
 building_type_dragon_attack: "Dragons"
 building_dragon_attack_cleared: "Dragon Vanquished"
 building_dragon_attack_cleared_desc: "The great drake that once terrorised these lands is no more.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_flooded_lands: "Devastating Floods"
 building_flooded_lands_desc: "This land is prone to flooding, causing destruction to anything that gets in its way, whether natural or constructed."
 building_type_flooded_lands: "Flood"
 building_flooded_lands_cleared: "Flooding Averted"
 building_flooded_lands_cleared_desc: "Whether by the construction of levees, low-lying areas for overflow, or dedicated drainage systems, the effects of flooding on these lands have been greatly reduced.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_bandits: "Bandit Country"
 building_bandits_desc: "Ruthless bandits wander these lands, harrying innocent travellers and would-be settlers alike."
 building_type_bandits: "Bandits"
 building_bandits_cleared: "Order Restored"
 building_bandits_cleared_desc: "The majority of the local bandit population have been brought to justice or fled, making it safer for the new settlements growing in the area.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_wild_orcs: "Wild Orcs"
 building_wild_orcs_desc: "There are a few wild, unorganized [orcish|E] tribes found in this area, decreasing colonial safety."
 building_type_wild_orcs: "Wild Orcs"
 building_wild_orcs_cleared: "Wild Orcs Defeated"
 building_wild_orcs_cleared_desc: "Most of the wild [orcs|E] have been killed or driven off, making sure the settlers can focus on building up the colony freely. \n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_dense_growth: "Dense Undergrowth"
 building_dense_growth_desc: "An impenetrable barrier of plant life covers large spans of this area, making traversal difficult and dangerous."
 building_type_dense_growth: "$building_dense_growth$"
 building_dense_growth_cleared: "Thicket Clearings"
 building_dense_growth_cleared_desc: "The thicket has been culled, and several clearings allow us to travel between our settlement sites with relative safety.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"


 building_frozen_ground: "Frozen Ground"
 building_frozen_ground_desc: "The very earth itself is frozen solid in this region, hindering crop growth and causing afflictions through the sheer cold."
 building_type_frozen_ground: "Frozen Ground"
 building_frozen_ground_cleared: "Thawed Ground"
 building_frozen_ground_cleared_desc: "The cold has been pushed back and the ground slowly begins to unfreeze, allowing for agriculture and relatively normal living.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_pirate_remnants: "Pirate Remnants"
 building_pirate_remnants_desc: "Though the main pirate stronghold has been dismantled, remnants of the old crew still linger in the area. Stragglers and petty raiders prey upon the unwary, threatening trade and settlement efforts."
 building_type_pirate_remnants: "Pirates"
 building_pirate_remnants_cleared: "Pirates Expelled"
 building_pirate_remnants_cleared_desc: "The last of the pirate stragglers have been hunted down or driven off. With the waters and roads now secure, settlers and merchants alike can breathe easier.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"


 building_collapsed_ceiling: "Collapsed Ceilings"
 building_collapsed_ceiling_desc: "Several key rooms of this subterranean complex have suffered cave-ins, resulting in large piles of rubble blocking the path."
 building_type_collapsed_ceiling: "Collapsed Ceilings"
 building_collapsed_ceiling_cleared: "Reinforced Ceilings"
 building_collapsed_ceiling_cleared_desc: "The rubble has been cleared out, and the ceilings of these rooms have been reinforced to avoid any further cave-ins.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_flooded_tunnels: "Flooded Tunnels"
 building_flooded_tunnels_desc: "A large part of this area lies submerged in dark, murky water. We need to find a way to redirect it as it restricts our access to the [colony|E]."
 building_type_flooded_tunnels: "Flooded Tunnels"
 building_flooded_tunnels_cleared: "Drained Tunnels"
 building_flooded_tunnels_cleared_desc: "The water has been successfully drained from these tunnels, allowing us access to them.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_flooded_tunnels_nogrod: "Flooded Hold"
 building_flooded_tunnels_nogrod_desc: "After the War of Wrath, most of Nogrod was submerged beneath unfathomable amounts of water. Any settlement in this Hold cannot progress until the water is drained."
 building_type_flooded_tunnels_nogrod: "Flooded Hold"
 building_flooded_tunnels_nogrod_cleared: "Drained Hold"
 building_flooded_tunnels_nogrod_cleared_desc: "The water has been successfully drained from these tunnels, allowing us access to them.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_stale_air: "Stale Air"
 building_stale_air_desc: "The air is unbreathable in large portions of this area. We need to find a way to get rid of these toxic fumes as they pose a danger to our settlers."
 building_type_stale_air: "Stale Air"
 building_stale_air_cleared: "Breathable Air"
 building_stale_air_cleared_desc: "Whether through setting up a ventilation system or by simply painting warning signs in front of dangerous rooms, we have made this area now possible to navigate.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_strange_creatures: "Strange Creatures"
 building_strange_creatures_desc: "Our settlers tell tales of strange creatures that lurk in the shadowy corners and dark crevices of the underground complex. Their descriptions vary wildly, but there have been reports of ambushes on our scouts and raids on our supplies. We need to clear these creatures out to secure the future of our settlement."
 building_type_strange_creatures: "Strange Creatures"
 building_strange_creatures_cleared: "Creatures Subdued"
 building_strange_creatures_cleared_desc: "Reports of the strange creatures have waned, and our efforts to increase security seem to have been successful. Whatever they were, they are gone now, likely having retreated to deeper corners of the subterranean.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

### ORCISH STANDARD BUILDINGS ###
 # Slave Farms
 building_type_slave_farms_01: "Slave Farms"
 building_type_slave_farms_01_desc: "Where there's a whip, there's a will, and these farms #emphasis will#! feed our [orcs|E], from the meagre Snaga to the hulky Uruk-hai. The farms are worked by tithed thralls and slaves snatched from our enemies."
 building_slave_farms_01: "Crop Fields"
 building_slave_farms_01_desc: "Fields growing crops native to the region are sown and seen to by our slaves. Toiling in the dirt from dawn until dusk, these sad saps subsist on scraps, whilst the fruits of their labours are taken by their dark masters."
 building_slave_farms_02: "Grain Stores"
 building_slave_farms_02_desc: "Great piles of grain are stored here. Spindly Snaga [orcs|E] are relegated to collecting the goods - but don't let them paw the stuff with their greasy graspers - we don't want maggoty bread!"
 building_slave_farms_03: "Slums"
 building_slave_farms_03_desc: "Hastily erected slave pens allow more workers to be kept on the farms. These shoddy and cramped living areas offer no comfort after a hard day's graft, though a 'lucky' slave may be able to catch and cook one of the slum's many rats for a little extra protein."
 building_slave_farms_04: "Irrigation Canals"
 building_slave_farms_04_desc: "Long ditches dug by slaves are allowed to flood from local water sources, extending the range of fertile land around the farms; if the land doesn't want to provide, we'll make it."
 building_slave_farms_05: "Extensive Fields"
 building_slave_farms_05_desc: "Vast fields stretch out to the horizon, thrumming with activity and the crack of lashing whips. Harvests are larger than ever, now that we have cleared the trees and bent all the arable land to our will."
 building_slave_farms_06: "Slavemaster's Lodgings"
 building_slave_farms_06_desc: "As the importance and productivity of the farm grow, so too does the importance of workforce suppression. These daunting square lodgings house stern and savage Uruk chiefs, handpicked for their ability to intimidate and dominate the weaker-willed workforce."
 building_slave_farms_07: "Wagon Depots"
 building_slave_farms_07_desc: "If we're going to cover [middleearth|E] in a second darkness, we need a proper way to get nosh to the front lines. These wagon depots allow us to split the vittles fair and square before being brought to the borders."
 building_slave_farms_08: "Bartering Posts"
 building_slave_farms_08_desc: "Surplus crops are traded with other Uruk-hai at outposts on the edge of the farm. These trades rarely involve the exchange of gold and largely require the bartering of treasures, weapons, and fresh slaves. Strange how much booty you can get for grain."

 # Logging Outposts
 building_type_logging_outposts_01: "Logging Outposts"
 building_type_logging_outposts_01_desc: "The Dark Lord doesn't like the way the trees block his view, we hear, so chop 'em down and find a use for 'em."
 building_logging_outposts_01: "Logging Camp"
 building_logging_outposts_01_desc: "Idle stray Snaga have been given some rusty axes and hatchets and told to make themselves useful. They are as likely to fell each other as a tree, but maybe that is for the best. Any lumber is a bonus."
 building_logging_outposts_02: "Loggers Huts and Gear"
 building_logging_outposts_02_desc: "The Snaga that haven't chopped trees onto their own heads have been rewarded with four walls, a roof, and some axes that can split bark rather than dent it. Let's hope they don't use them on each other, though I suppose they might be burying the hatchet."
 building_logging_outposts_03: "Slave Shacks"
 building_logging_outposts_03_desc: "Orders from the top: it is time to pick up the pace! These Tarks are to work under the remaining Snaga, and so the blind lead the blind. The shacks are to be minimal and breezy; slaves are supposed to get our wood, not use it."
 building_logging_outposts_04: "Slave-catchers"
 building_logging_outposts_04_desc: "A few of the Tarks have been escaping into the forest, and the Warg riders are sick of chasing them down. These [orcs|E] have been brought from the Misty Mountains for their excellent tracking skills. May the games begin."
 building_logging_outposts_05: "Industrial Sawmill"
 building_logging_outposts_05_desc: "Finally, some proper chopping tools! This magnificent blade can bite through the bole of the biggest tree and makes a delightful sound as it slices through the air. It is labour intensive, though, so it is a good thing we have got plenty of manpower."
 building_logging_outposts_06: "Timber Trolls"
 building_logging_outposts_06_desc: "These burly brutes have wandered all the way here from the Trollshaws. Luckily, we have found a way to use 'em. When they get bored of the sawmill, we just tell 'em that the trees have elves in them. Bye, bye, trees."
 building_logging_outposts_07: "Widespread Watchtowers"
 building_logging_outposts_07_desc: "The slave catchers were getting spread a little thin. These daunting, lofty perches offer our knife-eyed snipers a chance to end the chase early. They will still try, stupid Tarks. They can't see the wood for the trees."
 building_logging_outposts_08: "Wood-drying Kilns"
 building_logging_outposts_08_desc: "These huge industrial kilns allow us to dry the wood out much faster, meaning we can use the lumber sooner. It also is more effective than air drying and makes the wood more flammable."

 # Slave Mines
 building_type_slave_mines_01: "Slave Mines"
 building_type_slave_mines_01_desc: "Slaves and Lesser [orcs|E] are put to work underground in this shallow mine to extract the mineral wealth required to fuel the Orcish war machine."
 building_slave_mines_01: "Rock Quarries"
 building_slave_mines_01_desc: "With new small encampments and minor barricades spreading across the realm every day, rock and rubble are necessary raw materials sent to the construction sites."
 building_slave_mines_02: "Iron Lodes"
 building_slave_mines_02_desc: "With our blades and armour, we shall march upon our enemies and bring the Age of Men to an end. But for that, we will need all the iron we can unearth."
 building_slave_mines_03: "Shaft Mines"
 building_slave_mines_03_desc: "Only the tiniest of the [orcs|E] are sent down the shafts. The smaller they are, the better they can navigate the narrow corridors of the underground caverns. And since they are not expected to return, there is no loss."
 building_slave_mines_04: "Deep Shaft Mines"
 building_slave_mines_04_desc: "[orcish|E] prospectors sink deep shafts into the barren earth with the knowledge that they will find the metal they have been surveying for. Once the shaft has been sunk, a network of tunnels extends outwards, fingers reaching for the last nugget of an ore vein."
 building_slave_mines_05: "Monstruous Miner Pens"
 building_slave_mines_05_desc: "After being broken into submission, Trolls and Graugs are used to tear down the hardiest rock formations, opening paths for the miners to find veins of precious resources."
 building_slave_mines_06: "Super Pit Mines"
 building_slave_mines_06_desc: "Like a gaping wound, the crust of the earth is laid bare by the iron tools of the [orcs|E], revealing the riches of the underground. Guard posts at the brink of the pit watch for deserting slaves."
 building_slave_mines_07: "Industrial Excavators"
 building_slave_mines_07_desc: "Massive maws of iron rip up the earth, stripping the land bare in search of metal and stone."
 building_slave_mines_08: "Slave Mines of the Deep"
 building_slave_mines_08_desc: "Vast mines stretching in twisted and chaotic webs throughout the depths of the earth, vast hosts of toiling slaves work until they die in these miserable mines.\n\nBy the end of the [thirdage|E], the Orcs were second only to the Dwarves in their mining infrastructure, and by discovering subterranean caverns and exploiting slaves, they could reach the hidden wealth of the underworld."

 # Raiding Camps
 building_type_raiding_camps_01: "Raiding Camps"
 building_type_raiding_camps_01_desc: "Raiding fulfills an [orc|E]'s hunger for food and loot, as well as the natural entertainment that comes with the thrill of battle."
 building_raiding_camps_01: "Makeshift Shelters"
 building_raiding_camps_01_desc: "A ramshackle shanty town of crooked huts, filthy hovels, and sagging tents provides accommodation, of a sort, for the orc raiders."
 building_raiding_camps_02: "Ramshackle Watch Tower"
 building_raiding_camps_02_desc: "Part barracks, part snooping post to deter the [orcs|E] from stealing each other's loot."
 building_raiding_camps_03: "Foragers"
 building_raiding_camps_03_desc: "Round up the more useless snagas, kick 'em out of camp, and tell them to come back with grub or they'll get a good beating."
 building_raiding_camps_04: "Shacklemakers"
 building_raiding_camps_04_desc: "Find the [orc|E] who can remember how to beat bits of metal into round bits of metal. Find the other Orc who remembers how to stick the round bits of metal together. Use the resulting contraption to stop your prisoners from getting away."
 building_raiding_camps_05: "Captive Cages"
 building_raiding_camps_05_desc: "Put your captives in here. Don't forget them - theyre better eaten fresh."
 building_raiding_camps_06: "Loot Huts"
 building_raiding_camps_06_desc: "Pile your ill-gotten gains in here. That big guard-orc won't steal your stuff - most of the time."
 building_raiding_camps_07: "Ransomhouse"
 building_raiding_camps_07_desc: "Once in a while you're not hungry enough to eat your captives straight away. Occasionally this gives the captives' pals time to buy them back off you. This gives you a chance to steal them again - and then eat them."
 building_raiding_camps_08: "Warg Outriders"
 building_raiding_camps_08_desc: "Big, nasty, hairy, massive teeth. And that's just the [orcs|E]. Imagine how much more unpleasant they'd be sat on an unnaturally colossal angry wolf. Just steer clear of burning pine cones; they hate that."

 # Uruk Pits
 building_type_uruk_pits_01: "Uruk Pits"
 building_type_uruk_pits_01_desc: "Large and powerful [orcs|E] known as Uruks are bred and taught to fight with strength and ferocity in these foul pits."
 building_uruk_pits_01: "Uruk Pit"
 building_uruk_pits_01_desc: "In these filthy pits, powerful [orcs|E] known as Uruk are born and taught to be fierce and brutal."
 building_uruk_pits_02: "Training Yards"
 building_uruk_pits_02_desc: "In barren yards, Uruks are taught how to fight in formation and in groups... if not always coherently, at least somewhat effectively."
 building_uruk_pits_03: "Weapon Stores"
 building_uruk_pits_03_desc: "Uruk weapons of war are kept among the filth and detritus of these dark chambers. Iron helms, crudely forged swords, pikes, and crossbows are stored in haphazard piles, waiting to be taken by the next spawn."
 building_uruk_pits_04: "Mess Halls"
 building_uruk_pits_04_desc: "Grimy rooms where Uruks gather to gorge on flesh around open fires. The largest and most fierce among them eat the juiciest flesh, leaving the scraps for lesser Uruks."
 building_uruk_pits_05: "Barracks"
 building_uruk_pits_05_desc: "Far from the birthing grounds, fully fledged Uruks dwell in cramped and dirty barracks, ready for their next battle."
 building_uruk_pits_06: "Hunting Warrens"
 building_uruk_pits_06_desc: "A chaotic network of subterranean tunnels used for easy access to prime hunting grounds."
 building_uruk_pits_07: "Fighting Pits"
 building_uruk_pits_07_desc: "Dimly lit arenas constantly teeming with activity and the sounds of combat. In these pits, the Uruks settle disputes and establish their hierarchies in ruthless armed combat until their opponent submits or perishes."
 building_uruk_pits_08: "Alpha Dens"
 building_uruk_pits_08_desc: "Roomy abodes held by the strongest and most ruthless Uruks, filled with gruesome trinkets and trophies of past battles and conquests."

 # Furnaces
 building_type_furnaces_01: "Furnaces"
 building_type_furnaces_01_desc: "Hot, sweaty Orcs slave over their forges, crafting crude weapons and armour."
 building_furnaces_01: "Wood-Fired Furnaces"
 building_furnaces_01_desc: "Desolating a nearby forest, the Orcs feed wood into their furnaces."
 building_furnaces_02: "Slave-Powered Bellows"
 building_furnaces_02_desc: "Slaves power these furnaces, but their cries are drowned out by the furnace's roar. With a powerful furnace at their disposal, Orc metalworkers produce countless blades for the armies of darkness."
 building_furnaces_03: "Charcoal-Fired Furnaces"
 building_furnaces_03_desc: "Wood is prepared as charcoal in nearby burners; beasts haul it into the furnace."
 building_furnaces_04: "Coal-Fired Furnaces"
 building_furnaces_04_desc: "Mined from the earth, black coal fuels the Orc furnace, building weapons and machines of war."
 building_furnaces_05: " Troll-Powered Bellows"
 building_furnaces_05_desc: "Trolls under heavy whips and tormented by sharp pokers run the bellows."
 building_furnaces_06: "Endless Smokestacks"
 building_furnaces_06_desc: "The air you breathe here is thick with smoke. No daylight penetrates the smog; there is no telling what time it is, and under dark clouds, the smokestacks spew their reek and burn continuously."
 building_furnaces_07: "Graug-Powered Bellows"
 building_furnaces_07_desc: "Only an enslaved Graug has the strength needed to operate the unwieldy bellows required to feed the mightier of our furnaces."
 building_furnaces_08: "Blast Furnaces"
 building_furnaces_08_desc: "An Olog-hai dictator runs the operation of many ironclad blast furnaces, all running at full capacity. The master has a magnitudinous order for their great wars."
 #magnitudinous = big in an “elite” sense, the Olog-hai is elitist dictator

 # Warg Pits
 building_type_warg_pits_01: "Warg Pits"
 building_type_warg_pits_01_desc: "Vicious dire wolves bred and trained to be fearsome [orcish|E] mounts."
 building_warg_pits_01: "Warg Breeders"
 building_warg_pits_01_desc: "Wargs are bred and 'domesticated' here, a vital steppingstone to having them available for riders."
 building_warg_pits_02: "Warg Riders"
 building_warg_pits_02_desc: "Finally corralled, riders are trained to control and ride the Warg, to various degrees of success."
 building_warg_pits_03: "Warg Saddle"
 building_warg_pits_03_desc: "A crude approximation of a horse saddle, the Warg Saddle is designed to allow the rider to lean and weave while they wave their raider sword."
 building_warg_pits_04: "Wargry-Archers"
 building_warg_pits_04_desc: "With the saddles allowing them freedom of movement while riding, some ambitious riders have taken to competing on who can hit a target using a bow while riding. Loser has to get grog for the whole group!"
 building_warg_pits_05: "Armoured Wargs"
 building_warg_pits_05_desc: "While they can't bear a full armour like a horse, light leather armour can greatly enhance our Warg's survivability."
 building_warg_pits_06: "Warg Squads"
 building_warg_pits_06_desc: "Now fully trained and equipped, our Warg-riders have been organised into small bands that conduct coordinated raids."
 building_warg_pits_07: "Warg Band"
 building_warg_pits_07_desc: "With the success of our Warg squad, the Warg-riders have started to organise into larger bands that often disappear from camp to conduct raids on other warbands. Though they are rambunctious and uncontrollable, their effectiveness cannot be denied."
 building_warg_pits_08: "Warg Host"
 building_warg_pits_08_desc: "In a twisted approximation of a cavalry army, our Warg-riders now thunder across the land, spreading terror wherever they go before disappearing over the horizon when the enemy arrives."

 # Scouting Posts
 building_type_scouting_posts_01: "Scouting Posts"
 building_type_scouting_posts_01_desc: "Orcs sent out to scout the area, looking for any signs of danger or potential prey."
 building_scouting_posts_01: "Lookout Tower"
 building_scouting_posts_01_desc: "Keep an eye on the enemy from here. If you spot the enemy, kill him. Steal his food. Or turn him into food. Or all of the above."
 building_scouting_posts_02: "Spiked Ditches"
 building_scouting_posts_02_desc: "If there's one thing the enemy likes less than a ditch, it's a ditch full of spikes. Sometimes you can cook your enemy directly on the spikes, like a massive kebab."
 building_scouting_posts_03: "Torch Stores"
 building_scouting_posts_03_desc: "Useful for when it's really, really dark. Also, for starting fires to cook your enemy on."
 building_scouting_posts_04: "Orcfire Munitions"
 building_scouting_posts_04_desc: "Nasty stuff. Smear it on your arrows. If there's one thing nastier than being stuck with an arrow, it's when the arrow's on fire."
 building_scouting_posts_05: "Communications Flag Tower"
 building_scouting_posts_05_desc: "More of the enemy than you? Worried that if you run away, you'll have to leave all your loot behind? Wave that big flag, and with luck, some of your orc pals will come and help you out."
 building_scouting_posts_06: "Hunter Warg Pit"
 building_scouting_posts_06_desc: "Wargs make scouting faster and scare the bejesus out of the enemy. Unfortunately they will also eat you at the slightest sign that you're injured."
 building_scouting_posts_07: "Snuffler's Tavern"
 building_scouting_posts_07_desc: "Snuffler only serves one drink - grog. But it's good grog. At least that's what we tell him, or he gets upset and kills you with a barstool."
 building_scouting_posts_08: "Fortified Barricade"
 building_scouting_posts_08_desc: "Is ‘fortified barricade’ a tautology? Arguably. Still, it's a barricade and keeps the enemy away long enough for you to have another chance at sticking him with an arrow, so who cares?"

 # Siege Works
 building_type_orc_siege_works_01: "Siege Works"
 building_type_orc_siege_works_01_desc: "Assembly yards for all sorts of nasty siege weapons."
 building_orc_siege_works_01: "Stockpiles"
 building_orc_siege_works_01_desc: "Logs, wheels, cogs, ropes, the lot. If you figure out how to put all of these bits together, someone's going to get hurt."
 building_orc_siege_works_02: "Crude Forge"
 building_orc_siege_works_02_desc: "Best steer clear of that big angry orc with the giant hammer and one arm considerably bigger than the other, but he sure knows how to turn scrap iron into a battering ram."
 building_orc_siege_works_03: "Gearworks"
 building_orc_siege_works_03_desc: "Some of the really nasty, complicated siege weapons are made here. Perfect for chucking severed heads over walls."
 building_orc_siege_works_04: "Ammunition Hut"
 building_orc_siege_works_04_desc: "Rocks. Chunks of masonry. [gondorian|E] heads."
 building_orc_siege_works_05: "Firing Range"
 building_orc_siege_works_05_desc: "Sensible [orcs|E] stay away from here. The siege weapons are impressive, sure, but getting them to hit anything involves trial and error - mostly error."
 building_orc_siege_works_06: "Experimental Armsmith"
 building_orc_siege_works_06_desc: "'What's he building in there?' \n\nNo one likes the experimental armsmith. He mutters to himself, he drinks too much grog, he stares at you with rabid eyes. He disappears into his workshop for days on end, and all we hear is banging, whimpering, and sometimes sobbing. But occasionally he comes up with a contraption of especially crooked genius. \n\nOnce he didn't come out for three weeks. We thought he'd died, but when we finally plucked up the courage to look in his hut, we discovered he'd invented Grond."
 building_orc_siege_works_07: "Siege Tower Workshop"
 building_orc_siege_works_07_desc: "Those [orcs|E] with a head for heights and the ability to hit a nail into a plank or wood are dragooned into the Siege Tower Workshop. If you can't knock a wall down, you can always try to go over it."
 building_orc_siege_works_08: "Foundry of the Underworld"
 building_orc_siege_works_08_desc: "The mountainous warehouse where the darkest war machines of the Orc are assembled. Here, not only are these towering weapons of destruction fashioned from black iron, but they are also imbued with ancient spells of ruin."

 # Hunting Outposts
 building_type_hunting_outposts_01: "Hunting Outposts"
 building_type_hunting_outposts_01_desc: "Organised hunting packs sent out in search of any edible flesh."
 building_hunting_outposts_01: "Hide Shelters"
 building_hunting_outposts_01_desc: "We all love eating flesh. But it turns out that if you save the chewy bit on the outside, you can turn it into a tent. Decent place to get a bit of kip after a big meal."
 building_hunting_outposts_02: "Hide Watchtower"
 building_hunting_outposts_02_desc: "Useful for keeping an eye on your food supplies. Hide watchtowers are light enough that you can easily move them around, which sadly is usually also true of your food supplies."
 building_hunting_outposts_03: "Ghûl Pen"
 building_hunting_outposts_03_desc: "Ghûls are nasty, hairless vermin native to the fetid caves of Mordor. [orcs|E] are the same, only hairy. Both eat the other given half a chance, but only Orcs know how to build a storage pen."
 building_hunting_outposts_04: "Gristle Hut"
 building_hunting_outposts_04_desc: "This is where you store the most chewy, crunchy, fatty, barely digestible bits of flesh. Hung, cured, and smoked. Most races wouldn't touch it, but [orcs|E] consider it a delicacy worth its weight in gold. In sausage form it's almost as effective as lembas, but less dusty."
 building_hunting_outposts_05: "Hunter's Armoury"
 building_hunting_outposts_05_desc: "All the tools of the trade - spears, nets, bows, slings, and a drawer full of miscellaneous broken tools and bits of string that no one ever uses but the chief armourer is weirdly protective of."
 building_hunting_outposts_06: "Hunter's Wargery"
 building_hunting_outposts_06_desc: "Wargs make hunting faster and more furious. The perfect hunter's steed. Except when they eat everything before you get a chance to drive them off."
 building_hunting_outposts_07: "Caragor Pit"
 building_hunting_outposts_07_desc: "Like Wargs, but big enough to take down a [trolls|E]. What's not to like?"
 building_hunting_outposts_08: "Graug Cage"
 building_hunting_outposts_08_desc: "Graugs are difficult beasts. Expensive to feed. Really bad temper. Basically untameable. But also unkillable. If you manage to point one of these in the right direction, it will slay a Mûmak in under 30 seconds. You'll be dining out on that for months - literally."

 # Liquor Stills
 building_type_liquor_stills_01: "Liquor Stills"
 building_type_liquor_stills_01_desc: "Fermented grains and vegetables are processed in these distilleries to produce an [orcish|E] liquor known to burn the back of the throat and leave the whole body abuzz with a hot and fierce glow."
 building_liquor_stills_01: "Grog Huts"
 building_liquor_stills_01_desc: "A scattered assortment of filthy equipment is strewn around these small huts. Each hut houses a grog distiller, sweating into their pot as they tend to their mash over a burner. The everyday liquor, or grog, made in these huts is known to assault even the dullest of taste buds and play havoc with the guts."
 building_liquor_stills_02: "Stills"
 building_liquor_stills_02_desc: "As good brewing equipment is hard to produce, only the more skilled grog makers are given access to proper stills where firewater is made. Known to be a strong aphrodisiac, many an orc baby has the produce of these stills to thank for their existence."
 building_liquor_stills_03: "Distilleries"
 building_liquor_stills_03_desc: "Long halls lined with large copper boilers produce a steady supply of fine [orcish|E] liquor, drained off through a series of thin pipes ready to be stored in wooden barrels. While still retaining its famed kick, the liquor from these stills has a more complex sweet and earthy flavour enjoyed by only the most prominent of Orcs."

 # Orc Barracks
 building_type_orc_barracks_01: "Orc Barracks"
 building_type_orc_barracks_01_desc: "Orcs making babies."
 building_orc_barracks_01: "Birthing Grounds"
 building_orc_barracks_01_desc: "Acrid cesspits full of mud and mucus where large numbers of Uruks are brought into being using dark arts."
 building_orc_barracks_02: "Rousing Pools"
 building_orc_barracks_02_desc: "Tainted pools where freshly raised Uruks are brought to full consciousness."
 building_orc_barracks_03: "Spawning Vats"
 building_orc_barracks_03_desc: "A vast, labyrinthine complex from whose foul depths the Uruk hordes come forth."

 # Loot Houses
 building_type_loot_houses_01: "Loot Houses"
 building_type_loot_houses_01_desc: "Hordes fit for dragons, here gold and silver are piled in great heaps."
 building_loot_houses_01: "Pile o' Loot"
 building_loot_houses_01_desc: "The [orcs|E] have just begun to pile up the loot in one corner of the camp, claiming that if it is out in the open, then nobody can easily steal the shinies, and everybody will know how they're doled out."
 building_loot_houses_02: "Loot Chests"
 building_loot_houses_02_desc: "After one too many instances of brutal fights breaking out over the loot piles, the war chief has forced his boys to place the shinies in locked chests."
 building_loot_houses_03: "Loot Storehouses"
 building_loot_houses_03_desc: "The loot coming in has become too great to store out in the open, inviting raids from other warbands. A crude storehouse with a permanent guard has been set up. From the outside, it might not appear like much, but inside hides vast wealth plundered from lands far and wide."

 # Proving Grounds
 building_type_proving_ground_01: "Proving Grounds"
 building_type_proving_ground_01_desc: "The dominance hierarchy is the bedrock of orc society, with an individual's worth and rank determined by their ability to overpower, intimidate, or deceive their peers. The most public of these displays can be found at the Proving Grounds, where the greatest of commanders are born in the glory of blood and slaughter."
 building_proving_ground_01: "Fighting Pits"
 building_proving_ground_01_desc: "The shrill sound of iron on iron and the desperate begging for mercy of the defeated are a common sight in these fighting pits. It is here that grudges are settled, rivalries are born, and the greatest fighters rise from the ranks."
 building_proving_ground_02: "Arena"
 building_proving_ground_02_desc: "Well-known warriors of the pits grow in renown and begin to become regular fixtures, drawing interested onlookers to see them settle their grudges."
 building_proving_ground_03: "Stands"
 building_proving_ground_03_desc: "Crude wooden stands allow growing crowds to watch as legends rise in the heat of the arena. Betting is commonplace among the rowdy rabble of onlookers, and liquor-fuelled brawls are as readily found in the stands as they are in the arena itself."

 # Tunnel Network
 building_type_tunnel_network_01: "Tunnel Network"
 building_type_tunnel_network_01_desc: "Crudely dug by slaves and the runts of orc society, these subterranean tunnel networks allow troops and supplies to move swiftly, unseen in the darkness."
 building_tunnel_network_01: "Bolt Holes"
 building_tunnel_network_01_desc: "Though barely more than a series of shallow warrens under the earth, these tunnels offer the opportunity to spring surprise attacks on enemies caught unaware and a safe place to retreat hidden from pursuers."
 building_tunnel_network_02: "Sprawling Tunnels"
 building_tunnel_network_02_desc: "Time spent excavating the more commonly used pathways and increasing the structural supports of the ceiling allows for quicker movement of reinforcements, supplies, and goods. Small chambers can be found along these routes, used as rudimentary storage rooms and dark spots for respite and recreation."
 building_tunnel_network_03: "Underground Labyrinth"
 building_tunnel_network_03_desc: "Over time, the constant expansion of these vast and extensive networks has formed a maze of irregular passages. These routes provide vital links to key locations that provide an efficient means of travel for those that know the way and the prospect of being forever lost to those that don't."

 # Slaughterhouses
 #building_type_slaughterhouses_01: "Slaughterhouses"
 #building_type_slaughterhouses_01_desc: "The only thing greater than an [orc|E]'s desire for blood and carnage is their insatiable hunger for flesh. These slaughterhouses process all manner of carcasses - whether [man|E], [orc|E], or beast - to feed vast numbers of hungry mouths. Looks like meat's back on the menu, boys!"
 #building_slaughterhouses_01: "Abattoirs"
 #building_slaughterhouses_01_desc: "Grizzly scenes of wanton slaughter are common in [orcish|E] abattoirs, second only to the sights of a battlefield after an Uruk raid. With flesh in such high demand, abattoir work is relentless, and there is no patience for laziness or excuses."
 #building_slaughterhouses_02: "Butchers"
 #building_slaughterhouses_02_desc: "After slaughter, the butchers get to work with skill and speed. Armed with heavy cleavers, they chop carcasses into portions of flesh, with the best cuts being set aside for [orc|E] war leaders. Butchers are often larger in stature than even some of the most fearsome Uruks, simply due to the healthy supply of meat consumed on the job."
 #building_slaughterhouses_03: "Eateries"
 #building_slaughterhouses_03_desc: "While not exactly offering haute cuisine, these eateries are always found buzzing with hungry [orcs|E]. The loud noises of gnashing teeth and tearing flesh travel almost as far as the wretched smell of the place."

 # Experimental Workshop
 building_type_experimental_workshop_01: "Experimental Workshop"
 building_type_experimental_workshop_01_desc: "Workshops where [orcs|E] experiment and innovate new ways to blow walls and palisades to smithereens."
 building_experimental_workshop_01: "Testing Grounds"
 building_experimental_workshop_01_desc: "Without much care or methodology, [orcs|E] test on this barren plain whatever they think might give them an edge."
 building_experimental_workshop_02: "Systematic Testing"
 building_experimental_workshop_02_desc: "In a twisted macabre parody of science, some [orcs|E] have begun to refine their creations through repeated testings, often with unwilling volunteers from among their brethren."
 building_experimental_workshop_03: "Mad-Orc Laboratory"
 building_experimental_workshop_03_desc: "A few key Uruks have wrested control of the weapons testing site, and they conduct experiments that are both brutal and stomach-turning. Even other [orcs|E] and Uruks now stay away from the workshop, knowing that they should just nod and accept whatever monstrosities are produced from the crazed minds within."

 # Heavy Armoury
 building_type_heavy_armoury_01: "Heavy Armoury"
 building_type_heavy_armoury_01_desc: "Vast stores of weapons and armour ready for war."
 building_heavy_armoury_01: "Heavy Armoury"
 building_heavy_armoury_01_desc: "A store in which weapons and armour of fell iron are piled high, awaiting the day they are used."
 building_heavy_armoury_02: "Ordinance Depot"
 building_heavy_armoury_02_desc: "Stones are prepped for siege engines, and hordes of barbed arrows are prepared, ready to inflict the cruellest of deaths."
 building_heavy_armoury_03: "Repositories of Steel"
 building_heavy_armoury_03_desc: "Uruk black-steel is stored here in great racks, waiting for legions to take them up."

 # Snaga Warrens
 building_type_snaga_warrens_01: "Snaga Warrens"
 building_type_snaga_warrens_01_desc: "Where Uruks hone their aim and Snaga learn to run."
 building_snaga_warrens_01: "Meatrot Cutters"
 building_snaga_warrens_01_desc: "These Snaga taste only the finest disposed rot, and the bread they enjoy is more maggot than grain."
 building_snaga_warrens_02: "The Communal Hut"
 building_snaga_warrens_02_desc: "The warren's mobile sewage hut and cesspits. Do not visit it."
 building_snaga_warrens_03: "Snaga Pit"
 building_snaga_warrens_03_desc: "Here the slave Orcs fight, and other Orcs come to gamble."

 # Monster Warrens
 building_type_monster_warrens_01: "Monster Warrens"
 building_type_monster_warrens_01_desc: "In deep pits and great iron cages are bred and grown terrible beasts of war, monstrous and ferocious, driven forward by the lashes of whips. Their every breathing moment is miserable, but when their fury is turned against the enemy they are nigh unstoppable."
 building_monster_warrens_01: "Pit of Beasts"
 building_monster_warrens_01_desc: "In deep, dank pits hollowed from the earth are bred the monstrous creatures, their loyalty assured through pain. They feast on rotting corpses until their maturity, when they are shackled and equipped."
 building_monster_warrens_02: "Training Ground of Monsters"
 building_monster_warrens_02_desc: "Upon their adulthood, the beasts are forced to fight each other. Those that win are equipped with armor and weaponry and trained; those that lose become food for the next generation."
 building_monster_warrens_03: "A Den of Savagery"
 building_monster_warrens_03_desc: "A seemingly endless cavern houses countless iron cages that house monstrous creatures, and at any given moment there is a birth and death. The strongest and fittest survive. Most do not."

 ### Dwarven Buildings ###
 #Localization by Jauffre/Cairo/Nemcraft#
 #Dwarven Ale#
 #building_type_dwarven_ale_house_01: "Local Brewer"
 #building_type_dwarven_ale_house_01_desc: "Local [dwarves|E] have taken it on themselves to set up rudementary stills to supply the alcoholic needs of the hold."
 building_type_dwarven_ale_house_10_desc: "Tales of mythic alcohols flow from this hold like a river of red ale. Travelers and adventures from all realms of Arda make the journey to this hold, hoping for but a drop of divine liquor."
 building_dwarven_ale_house_01: "Local Brewer"
 building_dwarven_ale_house_01_desc: "Local [dwarves|E] have taken it on themselves to set up rudimentary stills to supply the alcoholic needs of the hold."
 building_dwarven_ale_house_02: "Rough-Hewn Tavern"
 building_dwarven_ale_house_02_desc: "A section of the hold has been carved to make room for a small tavern; though crudely shaped, it has already proven a popular social meeting place."
 building_dwarven_ale_house_03: "Roadside Inns"
 building_dwarven_ale_house_03_desc: "By adding rooms to the hold's taverns, the innkeepers can charge migrants for room and board, doubling their profits."
 building_dwarven_ale_house_04: "Drinkslingers Union"
 building_dwarven_ale_house_04_desc: "Innkeepers and their employees have begun congregating into social clubs that exchange tips and network amongst themselves. Bartenders of the world, unite!"
 building_dwarven_ale_house_05: "Distillery"
 building_dwarven_ale_house_05_desc: "Advances in metallurgy have allowed the distillation of more potent varieties of liquor. The aromatic fragrance wafts throughout the district where the distillation occurs."
 building_dwarven_ale_house_06: "Sturdy Casks"
 building_dwarven_ale_house_06_desc: "The use of sealants prevents the leakage of precious alcohol whilst it is being stored."
 building_dwarven_ale_house_07: "Wine Larders"
 building_dwarven_ale_house_07_desc: "Advancements in storage and distillation techniques have given rise to the establishment of vast cellars packed to the brim with alcohol. Among the rows and rows of casks, some liquors wait for decades as their subtle flavors and rich tannins are skillfully drawn out."
 building_dwarven_ale_house_08: "Additional taps"
 building_dwarven_ale_house_08_desc: "Due to the vast array of patrons and regulars, taverns across the hold have installed additional taps to accommodate the surge."
 building_dwarven_ale_house_09: "A Tavern on Every Corner..."
 building_dwarven_ale_house_09_desc: "And a mug in every hand."
 building_dwarven_ale_house_10: "A Hall of Revelry"
 building_dwarven_ale_house_10_desc: "Tales of mythic alcohols flow from this hold like a river of red ale. Travelers and adventurers from all realms of Arda make the journey to this hold, hoping for but a drop of divine liquor."
 building_type_dwarven_ale_house_01: "Ale House"
 building_type_dwarven_ale_house_01_desc: "The hold doesn't have an alcohol problem per se, but rather an alcohol solution."
 #Mushrooms#
 building_dwarven_fungal_farm_01: "Mushroom Foraging Camps"
 building_dwarven_fungal_farm_01_desc: "Lacking the resources to develop agricultural plots, these [dwarves|E] are reduced to foraging for wild mushrooms dotting the cave walls."
 building_dwarven_fungal_farm_02: "Household Garden"
 building_dwarven_fungal_farm_02_desc: "Farming initiatives have given rise to the practice of household plots being set aside to cultivate mushrooms for personal consumption."
 building_dwarven_fungal_farm_03: "Crop Diversification"
 building_dwarven_fungal_farm_03_desc: "The hold has begun to import foreign mushrooms to the hold in an attempt to diversify their diet."
 building_dwarven_fungal_farm_04: "Abolishment of the Common Land"
 building_dwarven_fungal_farm_04_desc: "The common plots of the hold have been parceled up and handed out to the largest farmers in each region. The introduction of larger farms should make the cultivation easier to manage."
 building_dwarven_fungal_farm_05: "Fungal Plantations"
 building_dwarven_fungal_farm_05_desc: "As the Fungal Farms get larger and larger, a wealthy planter class emerges with control of the major farms. The common Dwarf now works as a labourer in the expansive fields."
 building_dwarven_fungal_farm_06: "Shroomshine Stills"
 building_dwarven_fungal_farm_06_desc: "Plantation owners have begun to set aside a portion of the excess crop to be turned into cheap alcohol. This maximizes the value gained from each batch of mushrooms."
 building_dwarven_fungal_farm_07: "Deals with the Mushroom Guilds"
 building_dwarven_fungal_farm_07_desc: "The largest farms have begun organizing together into guilds; by working more closely with these organizations, the hold can attempt to maximize the output of the farms under their sway."
 building_dwarven_fungal_farm_08: "Farm Integration"
 building_dwarven_fungal_farm_08_desc: "The hold has made efforts to merge the mushroom plots under its control into larger sections under direct control. This allows for the maximization of planting and harvesting of foodstuffs for the hold."
 building_dwarven_fungal_farm_09: "Central Planning Initiatives"
 building_dwarven_fungal_farm_09_desc: "A central administration has been established to oversee the operations of the farms. Every harvest must be inspected and every mushroom approved before consumption."
 building_dwarven_fungal_farm_10: "Fungal Forest"
 building_dwarven_fungal_farm_10_desc: "The sprawling farms have reached an immensity unimaginable to the original colonists of the hold. In caverns the size of castles, great forests of fungi carpet the surfaces. The Hold meticulously catalogs and cultivates each section."
 building_type_dwarven_fungal_farm_01: "Fungal Farm"
 building_type_dwarven_fungal_farm_01_desc: "Mushrooms have proven nutritious and can be cultivated in sufficient numbers to supply a hold with no natural light."
 #Terrace Farm
 building_type_dwarven_terrace_farm_01: "Dwarven Terrace Farm"
 building_type_dwarven_terrace_farm_01_desc: "Farming in mountainous or hilly terrain, whether it be above or below them, is a monumental task. One which the [dwarves|E] have perfected over the ages."
 building_dwarven_terrace_farm_01: "Root Excavations"
 building_dwarven_terrace_farm_01_desc: "The deep, fertile soil layers within the mountain are excavated and redistributed. [dwarven|E] miners carefully carve out steps from the terrain upon which crops may be grown."
 building_dwarven_terrace_farm_02: "Strong Foundations"
 building_dwarven_terrace_farm_02_desc: "Expert stonemasons meticulously craft the terrace walls, ensuring their stability and durability. Each stone is placed with precision, creating a tiered structure that will support the weight of the crops and withstand the test of time for ages to come."
 building_dwarven_terrace_farm_03: "Irrigation Canals"
 building_dwarven_terrace_farm_03_desc: "[dwarven|E] engineers channel water from under and overground water sources to irrigate the farm. Complex networks of aqueducts and channels are designed to distribute water evenly, guaranteeing optimal hydration for the crops throughout the entire farm."
 building_dwarven_terrace_farm_04: "Toolmaking"
 building_dwarven_terrace_farm_04_desc: "Blacksmiths forge specialized tools designed for terraced farming. These tools, with reinforced handles and unique blades, ensure the efficiency and productivity of the farm."
 building_dwarven_terrace_farm_05: "Crop Rotation"
 building_dwarven_terrace_farm_05_desc: "Meticulous crop rotation strategies are put in place, maximizing the fertility of the soil on each terrace. [dwarven|E] farmers balance the needs of various crops, enhancing overall yield."
 building_dwarven_terrace_farm_06: "Subterranean Mirrors"
 building_dwarven_terrace_farm_06_desc: "A true marvel of [dwarven|E] engineering, an intricate network of giant mirrors is put in place that reflects the light of the sun that graces the top of the mountain onto the farm underground."
 building_dwarven_terrace_farm_07: "Mushroom Integration"
 building_dwarven_terrace_farm_07_desc: "Specialized fungi are introduced to the terraced fields, enhancing soil fertility and promoting symbiotic relationships with the crops. These carefully cultivated fungi contribute to the overall health of the farm's ecosystem."
 building_dwarven_terrace_farm_08: "Overlook Platforms"
 building_dwarven_terrace_farm_08_desc: "Majestic platforms are constructed along the edges of the terraces, offering elevated viewpoints for overseeing the expansive fields."
 building_dwarven_terrace_farm_09: "Subterranean Vaults"
 building_dwarven_terrace_farm_09_desc: "Massive storage vaults are carved out beneath the terraces. [dwarven|E] miners create secure chambers to store the abundant harvest, preserving the fruits of their labour for times of need or trade."
 building_dwarven_terrace_farm_10: "A Reshaped Mountainside"
 building_dwarven_terrace_farm_10_desc: "A true triumph of [dwarven|E] engineering prowess. Dwarven engineers and farmers marvel at the landscape they have meticulously crafted, which can now be seen from a distance of several leagues, a testament to their dedication and ingenuity in transforming the mountain's embrace into a harmonious, productive masterpiece."
 #Construction#
 building_dwarven_toolmaker_guild_01: "Local Handydwarves"
 building_dwarven_toolmaker_guild_01_desc: "Local Craftsdwarves have begun taking commissions for the construction of dwellings."
 building_dwarven_toolmaker_guild_02: "Technical Drawings Office"
 building_dwarven_toolmaker_guild_02_desc: "The use of technical drawings allows for the planning and measurement of expansions to the hold, thus improving efficiency. This building consumes the most parchment of the entire hold."
 building_dwarven_toolmaker_guild_03: "Dedicated Blacksmiths"
 building_dwarven_toolmaker_guild_03_desc: "Blacksmiths have been allocated for tool production full-time. Within their forges, they churn out a steady stream of tools for the hold."
 building_dwarven_toolmaker_guild_04: "Journeyman Dwarves"
 building_dwarven_toolmaker_guild_04_desc: "An apprentice system has been set up for young [dwarves|E] to learn from the elder craftsdwarves... the free labour doesn't hurt either."
 building_dwarven_toolmaker_guild_05: "Tool-Maker Guilds"
 building_dwarven_toolmaker_guild_05_desc: "The Tool Blacksmiths have begun to organize into guilds that act as a political entity in the hold. This has allowed for the expansion of their operations."
 building_dwarven_toolmaker_guild_06: "Cranes"
 building_dwarven_toolmaker_guild_06_desc: "The importation of large quantities of wood has allowed the construction of cranes and pulleys to streamline the construction process."
 building_dwarven_toolmaker_guild_07: "Steel Tools"
 building_dwarven_toolmaker_guild_07_desc: "The widescale implementation of steel tools improved the efficiency of construction efforts in the region. The [dwarves|E] of the hold have expressed a fondness for the durability of the steel tools."
 building_dwarven_toolmaker_guild_08: "Standardized Molds"
 building_dwarven_toolmaker_guild_08_desc: "Standardized molds allow the blacksmiths of this hold to quickly manufacture tools of identical quality and durability. Molten metal is poured into the molds to cool into components for all manner of industry."
 building_dwarven_toolmaker_guild_09: "Dwarven Inspectorate"
 building_dwarven_toolmaker_guild_09_desc: "This hold has established an inspector's office to oversee the efficiency and safety of the workshop. The permits and reports of this agency surpass the technical drawings in parchment usage."
 building_dwarven_toolmaker_guild_10: "The Manufactorum"
 building_dwarven_toolmaker_guild_10_desc: "The scale of industry within this hold has reached an unfathomable scale. Within the walls of the factory complex, thousands of inhabitants live, work, and die. Tools are manufactured at a scale unseen elsewhere in Arda."
 building_type_dwarven_toolmaker_guild_01: "Toolmaker Guild"
 building_type_dwarven_toolmaker_guild_01_desc: "These buildings supply all manners of tools necessary for the construction of a proper delving."
# Dwarven Quarry #
 building_type_dwarven_quarry_01: "Dwarven Quarry"
 building_type_dwarven_quarry_01_desc: "To turn the stone walls of mountains into grand halls, good quality stone must be excavated."
 building_dwarven_quarry_01: "Prospector's Camp"
 building_dwarven_quarry_01_desc: "A humble camp marks the beginning of [dwarven|E] industry; Dwarven engineers draw up plans, and the foremen can be heard shouting orders."
 building_dwarven_quarry_02: "Excavation Pits"
 building_dwarven_quarry_02_desc: "As the [dwarves|E] dig deeper, the excavation pits expand, revealing veins of precious minerals and hard stones for the construction of great halls."
 building_dwarven_quarry_03: "Workshops"
 building_dwarven_quarry_03_desc: "Craftsmen set up a workshop amidst the quarry, fashioning the first rough-hewn stones."
 building_dwarven_quarry_04: "Stonecutter's Guild"
 building_dwarven_quarry_04_desc: "A guild of skilled stonecutters forms, refining their techniques and producing expertly shaped stones."
 building_dwarven_quarry_05: "Refinery"
 building_dwarven_quarry_05_desc: "[dwarven|E] engineers introduce refining facilities to extract the valuable ores from the rocks, elevating the quarry's production to include precious metals."
 building_dwarven_quarry_06: "Deep Mine Shafts"
 building_dwarven_quarry_06_desc: "Delving into the depths, the quarry expands with intricate mine shafts, reaching deeper into the mountain's heart to extract even more valuable resources."
 building_dwarven_quarry_07: "Vast Caverns"
 building_dwarven_quarry_07_desc: "[dwarven|E] miners reveal caverns adorned with a variety of exquisite gemstones. These precious stones, after being carefully extracted, diversify the quarry's offerings."
 building_dwarven_quarry_08: "Mason's Workshops"
 building_dwarven_quarry_08_desc: "Workshops dedicated to the most skilled masons emerge, producing meticulously carved marble stones that will adorn the grand halls and facades of [dwarven|E] realms."
 building_dwarven_quarry_09: "Rune-carver's Atelier"
 building_dwarven_quarry_09_desc: "[dwarven|E] rune-carvers establish an atelier and carve Cirth-runes into stones. These runes are written in [khuzdul|E] and reference multiple aspects of Dwarven culture."
 building_dwarven_quarry_10: "Grand Chasms"
 building_dwarven_quarry_10_desc: "The very pinnacle of [dwarven|E] quarrying achievement, this quarry is now a sanctuary of masterfully crafted stones and gems, representing the very soul of Dwarven architecture, and their enduring legacy has been etched into the very bedrock of Middle-earth."
 #arts and crafts#
 building_dwarven_crafts_01: "Local Wares"
 building_dwarven_crafts_01_desc: "Local crafters have begun producing small trinkets of value. While unimpressive at the moment, it serves as the first step for an aspiring hold."
 building_dwarven_crafts_02: "Wrought Gold"
 building_dwarven_crafts_02_desc: "Hammers are used to beat gold into shape for ornamentation and jewelry."
 building_dwarven_crafts_03: "Decorative Trimming"
 building_dwarven_crafts_03_desc: "The Craftsdwarves of this hold have turned their talent to the inlay and trimming of precious metals in various rooms of the hold."
 building_dwarven_crafts_04: "Gemcutters"
 building_dwarven_crafts_04_desc: "Jewelers labour day and night to cut and grind gems mined in the hold. Special care is used to cut the gems to draw out their glittering beauty."
 building_dwarven_crafts_05: "Jewelers Guild"
 building_dwarven_crafts_05_desc: "Jewelers have begun organizing into guilds that ensure a consistent quality and sparkle to all gems worked within this hold."
 building_dwarven_crafts_06: "Filigree"
 building_dwarven_crafts_06_desc: "Thin, spiderweb-like veins of gold are sculpted into the jewelry crafted by this hold."
 building_dwarven_crafts_07: "Clockworks"
 building_dwarven_crafts_07_desc: "The expertise in fine detailing has allowed the guild [dwarves|E] to expand into the field of clockworks. Intricately crafted gears and springs are produced as works of art."
 building_dwarven_crafts_08: "Standardized Tools"
 building_dwarven_crafts_08_desc: "The introduction of mechanical molds allows for small levels of automation in the form of mechanical grinders. Guild efforts of standardizing jewelry-making tools ensure the same level of quality at all stages of production."
 building_dwarven_crafts_09: "Expansive Trade Networks"
 building_dwarven_crafts_09_desc: "This hold now sits at the center of a massive trading network; merchants from all corners come to buy the crafts made by the [dwarves|E]."
 building_dwarven_crafts_10: "An Exhibition of Wonders"
 building_dwarven_crafts_10_desc: "A grand hall has been set aside for the exhibition of the finest crafts of the hold. Tales of the crafts produced at this hold have a near-mythic quality to them. It is said that the crafts made here are unrivaled in all of Arda."
 building_type_dwarven_crafts_01: "Crafts Guilds"
 building_type_dwarven_crafts_01_desc: "Crafts Guilds take the raw materials extracted from the mountain and turn them into all manner of valuables."

 #Associated Trigger
 dwarven_forge_dynasty_requirement: "Your dynasty needs the [GetDynastyPerk('lotr_crafting_legacy_3').GetName] perk"
 dwarven_forge_cap: "You can only have one active Forge in your domain and it must be in your capital"

 #Dwarven Forges
 building_type_dwarven_forge_01: "Forge-halls"
 building_type_dwarven_forge_01_desc: "Forges are take the best materials and tools of the Dwarven people to easily forge artifacts to show off to the people of [middleearth|E]"
 building_dwarven_forge_01: "Charcoal Hearth"
 building_dwarven_forge_01_desc: "A small hearth of stone, fueled by charcoal. It can smelt only limited quantities of ore, but it marks the beginning of organised metalworking."
 dwarven_forge_01_artifact_crafting_buff: "$unlocks_building_desc$Increases the success chance of crafting an artifact by: #P 2%#!\n"
 building_dwarven_forge_02: "Twin Bellows"
 building_dwarven_forge_02_desc: "Large, hand-pumped bellows allow higher and more consistent heat, producing stronger ingots and sturdier tools."
 dwarven_forge_02_artifact_crafting_buff: "$unlocks_building_desc$Increases the success chance of crafting an artifact by: #P 4%#!\n"
 building_dwarven_forge_03: "Stone Forges"
 building_dwarven_forge_03_desc: "Durable stone-lined forges provide better insulation and efficiency. The fires now reach hotter and steadier temperatures for advanced smithing."
 dwarven_forge_03_artifact_crafting_buff: "$unlocks_building_desc$Increases the success chance of crafting an artifact by: #P 6%#!\n"
 building_dwarven_forge_04: "Bloomery Forges"
 building_dwarven_forge_04_desc: "Enclosed bloomeries refine ore more efficiently, producing purer iron and the first reliable steels. Weapons and armor gain in quality."
 dwarven_forge_04_artifact_crafting_buff: "$unlocks_building_desc$Increases the success chance of crafting an artifact by: #P 8%#!\n"
 building_dwarven_forge_05: "Water-driven Bellows"
 building_dwarven_forge_05_desc: "Ingenious mechanisms use flowing water to drive great bellows. The forges burn hotter with less labor, allowing larger and more complex works."
 dwarven_forge_05_artifact_crafting_buff: "$unlocks_building_desc$Increases the success chance of crafting an artifact by: #P 10%#!\n"
 building_dwarven_forge_06: "Blast Furnaces"
 building_dwarven_forge_06_desc: "Towering furnaces smelt ore in great quantities, yielding consistent high-quality steel. Smithing output increases dramatically."
 dwarven_forge_06_artifact_crafting_buff: "$unlocks_building_desc$Increases the success chance of crafting an artifact by: #P 12%#!\n"
 building_dwarven_forge_07: "Forge Complexes"
 building_dwarven_forge_07_desc: "Entire halls are now devoted to smelting and smithing, with multiple furnaces, anvils, and workstations. Mass production of arms, tools, and armor is achieved."
 dwarven_forge_07_artifact_crafting_buff: "$unlocks_building_desc$Increases the success chance of crafting an artifact by: #P 14%#!\n"
 building_dwarven_forge_08: "Mechanised Hammers"
 building_dwarven_forge_08_desc: "Waterwheels and gears drive enormous hammers, striking with perfect rhythm. Heavy forging tasks are automated, freeing artisans for precise finishing."
 dwarven_forge_08_artifact_crafting_buff: "$unlocks_building_desc$Increases the success chance of crafting an artifact by: #P 16%#!\n"
 building_dwarven_forge_09: "Integrated Foundries"
 building_dwarven_forge_09_desc: "Ore smelting, forging, and finishing are integrated within vast foundries. Efficiency and scale reach heights no other folk can match."
 dwarven_forge_09_artifact_crafting_buff: "$unlocks_building_desc$Increases the success chance of crafting an artifact by: #P 18%#!\n"
 building_dwarven_forge_10: "The Great Forge"
 building_dwarven_forge_10_desc: "A central forge of unmatched design dominates the hold, combining the most advanced furnaces, mechanization, and ventilation systems. Here, the finest works of [dwarven|E] craft are produced in unending fire."
 dwarven_forge_10_artifact_crafting_buff: "$unlocks_building_desc$Increases the success chance of crafting an artifact by: #P 20%#!\n"

 #Dwarven Mines#
 building_dwarven_mine_01: "Horizontal Shafts"
 building_dwarven_mine_01_desc: "The first horizontal shafts have been carved out from the mountain. While the excavations have yielded fruits already, the work is slow going as structural supports need to be placed as they go."
 building_dwarven_mine_02: "Hushing"
 building_dwarven_mine_02_desc: "A new form of irrigation allows the miner to wash away soil and loose sediment concealing precious mineral veins."
 building_dwarven_mine_03: "Overseers"
 building_dwarven_mine_03_desc: "A system of overseers has been established to supervise the mining."
 building_dwarven_mine_04: "Pumps"
 building_dwarven_mine_04_desc: "The holds engineers have pioneered a system of water pumps to clear the tunnels of any hazards, making the labour safer."
 building_dwarven_mine_05: "Prospectors"
 building_dwarven_mine_05_desc: "Skilled prospectors use their knowledge to find the location of minerals throughout the mountain. Their heated discussions and the clanging of picks form a song of labour."
 building_dwarven_mine_06: "Centralized Mining Administration"
 building_dwarven_mine_06_desc: "A system of bureaucracy has been established to administer the mines in the name of the hold. All manner of reports, charts, and employee complaints pass across the desk of the main inspector."
 building_dwarven_mine_07: "Advanced Ventilation"
 building_dwarven_mine_07_desc: "A sophisticated system of bellows and pipes is rigged throughout the mineshafts, flushing toxic gases from the tunnels while piping in air."
 building_dwarven_mine_08: "Strip Mining"
 building_dwarven_mine_08_desc: "The overlapping tunnels have been excavated in a cross-hatched pattern of parallel lines. This allows the miners to cover a vast area with nary a delay."
 building_dwarven_mine_09: "Hydraulic Mining"
 building_dwarven_mine_09_desc: "Guided by the Stone-Singers, [dwarves|E] flood cracks in the stone with pressurized water to force them open. Pickaxes carve away the weakened stone with frightening efficiency."
 building_dwarven_mine_10: "Veins of the Earth"
 building_dwarven_mine_10_desc: "Within the innumerable tunnels running the length and breadth of the mountain, countless [dwarves|E] toil to extract the riches of the earth. Yet even at this scale, the hold is expanding ever onwards into the unknowable depths. For Rock and Stone!"
 building_type_dwarven_mine_01: "Dwarven Mining"
 building_type_dwarven_mine_01_desc: "Miners labour day and night to extract all manner of earthly riches."

 #Dwarven Hoard#
 building_dwarven_hoard_01: "Hall of Ingots"
 building_dwarven_hoard_01_desc: "In this initial chamber, [dwarven|E] blacksmiths proudly display freshly forged ingots of precious metal. The flickering light from the myriad metals adds a warm glow to the surroundings, signaling the beginning of the hoard's collection."
 building_dwarven_hoard_02: "Gemstone Gallery"
 building_dwarven_hoard_02_desc: "The hoard has expanded into vaults adorned with carefully embedded gemstones, creating a dazzling mosaic of luster and light. Each gem tells a story of fine [dwarven|E] craftsmanship and adds a vibrant allure to the accumulating treasures."
 building_dwarven_hoard_03: "Ancestral Reliquary"
 building_dwarven_hoard_03_desc: "Within these hallowed halls, ancient relics and ancestral heirlooms find their place. [dwarves|E] honour their heritage, showcasing artifacts passed down through generations, each item contributing to the hoard's cultural significance."
 building_dwarven_hoard_04: "Regal Treasury Chambers"
 building_dwarven_hoard_04_desc: "The hoard ascends into regal treasury chambers, featuring ornate displays of crowns, scepters, and other symbols of [dwarven|E] authority. The air is thick with an aura of opulence, showcasing the Dwarves' noble heritage."
 building_dwarven_hoard_05: "Citadel of Treasures"
 building_dwarven_hoard_05_desc: "Reaching the zenith of [dwarven|E] opulence, this Citadel is a monumental structure carved deep into the heart of the mountain. Here, the hoard is safeguarded by formidable defenses, and its treasures beyond measure, are a source of awe and envy across [middleearth|E]."
 building_type_dwarven_hoard_01: "Treasure Hoard"
 building_type_dwarven_hoard_01_desc: "The [dwarven|E] Treasure Hoard stands as a majestic repository for treasures gathered from the depths of the mountain; meticulously curated and fiercely guarded."

 #Dwarven Grand Library#
 building_dwarven_grand_library_01: "Stone Archives"
 building_dwarven_grand_library_01_desc: "The foundational level of the Grand Library houses the Stone Archives, where ancient scrolls and tomes are meticulously organized. [dwarven|E] scholars diligently record and preserve the accumulated knowledge of the hold."
 building_dwarven_grand_library_02: "Halls of Lore"
 building_dwarven_grand_library_02_desc: "In the Halls of Lore, the Grand Library unveils a more extensive collection of tomes, each meticulously categorized. Knowledge-seekers wander among towering bookshelves, while scribes diligently record new discoveries."
 building_dwarven_grand_library_03: "Lorekeeper's Sanctum"
 building_dwarven_grand_library_03_desc: "The Lorekeeper's Sanctum is adorned with intricate carvings house tomes of unparalleled insight and discovery. [dwarven|E] scholars, bathed in the iridescent light of its many crystal chandeliers, delve into the deepest recesses of accumulated wisdom, forging a legacy of enlightenment for generations to come."
 building_type_dwarven_grand_library_01: "Grand Library"
 building_type_dwarven_grand_library_01_desc: "The Grand Library is the paramount repository of knowledge within the hold, where the accumulated wisdom of generations is meticulously preserved and studied."

 #Dwarven Bank#
 building_dwarven_bank_economic_01: "Prospector's Vault"
 building_dwarven_bank_economic_01_desc: "The Prospector's Vault serves as the foundational establishment of any [dwarven|E] bank, safeguarding the hard-earned treasures of miners and traders. Sturdy vaults house the initial deposits, providing a secure space to house the guild's growing reserves."
 building_dwarven_bank_economic_02: "Chamber of Ledgers"
 building_dwarven_bank_economic_02_desc: "In the heart of the Guildhall, the Chamber of Ledgers sits. [dwarven|E] accountants meticulously record transactions, investments and loans on stone tablets, keeping track of the Guild's many activities."
 building_dwarven_bank_economic_03: "Grand Exchange"
 building_dwarven_bank_economic_03_desc: "Within the Grand Exchange's walls, traders from neighboring holds and distant realms converge to engage in prosperous exchanges, while [dwarven|E] bankers orchestrate complex transactions that shape the destiny of the hold's wealth."
 building_type_dwarven_bank_economic_01: "Banker's Guildhall"
 building_type_dwarven_bank_economic_01_desc: "With astute financial acumen, the Banker's Guild oversees investments and lends resources to fuel the development of the hold, fostering trade, innovation, and infrastructure."

 #Dwarven King's Armoury#
 building_dwarven_kings_armory_military_01: "Guardian's Arsenal"
 building_dwarven_kings_armory_military_01_desc: "The Guardian's Arsenal serves as the foundational storage for the hold's weaponry and armor. Sturdy racks and shelves hold rows of meticulously organized weapons and finely crafted armor, ensuring the readiness of the [dwarven|E] warriors. The air is tinged with the scent of oiled metal, and the atmosphere resonates with the anticipation of battle."
 building_dwarven_kings_armory_military_02: "Hall of Heroes"
 building_dwarven_kings_armory_military_02_desc: "In the Hall of Heroes, the armory takes on a more imposing form. Here, the most exceptional pieces of weaponry and armor are displayed in custom-crafted cases, each item a testament to the [dwarven|E] dedication to craftsmanship. Banners bearing the emblems of legendary warriors hang proudly, casting a solemn air over the vault as it showcases the pride and heritage of the hold."
 building_dwarven_kings_armory_military_03: "Royal Armament Chambers"
 building_dwarven_kings_armory_military_03_desc: "The Royal Armament Chambers stand as a testament to the hold's martial prowess. Rare and ancient armour and weaponry are housed within fortified chambers adorned with intricate carvings depicting great victories of the [dwarven|E] people. This sacred space exudes a regal air, with the finest armor gleaming under carefully placed shafts of light, awaiting the call to defend the kingdom and uphold Dwarven honour."
 building_type_dwarven_kings_armory_military_01: "Great Armoury"
 building_type_dwarven_kings_armory_military_01_desc: "The Great Armoury is the primary repository for the hold's weaponry and armor. Meticulously organized and well-maintained, it ensures our warriors are always ready to defend our home."


 #Fortifications#
 building_dwarven_vaults_01: "A Barred Door"
 building_dwarven_vaults_01_desc: "[dwarves|E] have begun to fortify their hold, affixing a bar across the hold's main gate."
 building_dwarven_vaults_02: "Earthworks"
 building_dwarven_vaults_02_desc: "Earth and Stone has been molded into a crude approximation of a wall, protecting the main gate and providing cover for stationed defenders."
 building_dwarven_vaults_03: "Gatehouse"
 building_dwarven_vaults_03_desc: "The main gate has been reinforced with a portcullis. Defenders stand watch atop stone battlements overlooking the streets below."
 building_dwarven_vaults_04: "Arrow Slits"
 building_dwarven_vaults_04_desc: "Thin arrow slits dot the towers overlooking the main gate. Archers peer through the cracks on passersby below, waiting to rain death from above."
 building_dwarven_vaults_05: "Killbox"
 building_dwarven_vaults_05_desc: "Stone walls have been erected to funnel attackers into a clearing where they are struck from all sides by all manner of bolts and stones."
 building_dwarven_vaults_06: "Moat"
 building_dwarven_vaults_06_desc: "A deep moat has been carved in the stone, filled to the brim with water pumped from underground lakes."
 building_dwarven_vaults_07: "Boiling Oil"
 building_dwarven_vaults_07_desc: "Pipes have been placed above the castle gate allowing for defenders to drop boiling oil down on besiegers."
 building_dwarven_vaults_08: "Trenches"
 building_dwarven_vaults_08_desc: "Spiked trenches have been placed between the moat and the wall, any [orc|E] or [goblin|E] looking to smash the wall must take care not to impale themselves on the spikes below."
 building_dwarven_vaults_09: "Defense in Depth"
 building_dwarven_vaults_09_desc: "Concentric Walls have been placed on each level of the hold. Any would-be besieger must fight from wall to wall while being harried from all sides."
 building_dwarven_vaults_10: "An Unassailable Stronghold"
 building_dwarven_vaults_10_desc: "This fortress has become on par with the great fortress cities of ages long past. Whole armies have retreated at the sight of these formidable defenses. A deadly array of traps and barricades litter the hold, detering all aggressors."
 building_type_dwarven_vaults_01: "Dwarven Gauntlets"
 building_type_dwarven_vaults_01_desc: "The riches of a delving are oft highly sought after by envious eyes, thus measures need to be taken to safeguard it."

 #Infrastructure#
 building_dwarven_roads_01: "Rudimentary Tunnels"
 building_dwarven_roads_01_desc: "The construction of tunnels throughout the Hold has enabled faster travel from one end to the other."
 building_dwarven_roads_02: "Pulley Systems"
 building_dwarven_roads_02_desc: "The implementation of pulley systems has helped connect different levels of the Hold far more efficiently. This connection also allows for easier transportation of materials and messages."
 building_dwarven_roads_03: "Arches"
 building_dwarven_roads_03_desc: "Supporting Arches have been erected to hold up the multilayered passages threaded across the mountain."
 building_dwarven_roads_04: "Torch-lit Caverns"
 building_dwarven_roads_04_desc: "The Denizens of this Hold have fully illuminated the caverns, bypassing the need for natural light."
 building_dwarven_roads_05: "Dwarven Concrete"
 building_dwarven_roads_05_desc: "[dwarven|E] experiments have produced a semi-liquid substance that hardens into stone. The substance's unparalled strength allows for the creation of more advanced structures."
 building_dwarven_roads_06: "Standardized Timekeeping"
 building_dwarven_roads_06_desc: "Clocks have been placed throughout the hold in order to create one local time observed throughout the Hold."
 building_dwarven_roads_07: "Load Bearing Stones"
 building_dwarven_roads_07_desc: "Well placed stones are used to reduce the number of required pillars, and enables some open spaces."
 building_dwarven_roads_08: "Earthquake Resistance"
 building_dwarven_roads_08_desc: "Dampers have been set in key load bearing areas to lessen the damage caused by Earthquakes."
 building_dwarven_roads_09: "Domes"
 building_dwarven_roads_09_desc: "With the construction of Domes, large amounts of space has been opened up. These areas are used to support the increasing population of the Hold."
 building_dwarven_roads_10: "Mastery of the Mountain"
 building_dwarven_roads_10_desc: "This Hold has become a logistical marvel. People from far-flung areas visit to stare in awe, or furiously jot down notes. Despite all the obstacles that the Denizens faced, the Hold can be said to have overcome every challenge the Mountain has thrown at them."
